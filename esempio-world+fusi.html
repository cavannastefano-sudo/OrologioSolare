<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mappa Mondiale e Fusi Orari - SunClock24</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/jpeg" href="IMG_20260808_102945.jpg">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/tz-lookup@6.1.25/tz.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            background: #0b1120;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .map-area {
            position: relative;
            flex: 1 1 auto;
            height: 100%;
            min-width: 0;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #0f172a;
        }

        .map-overlay-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 500;
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            padding: 6px 8px;
            border-radius: 8px;
        }

        .map-overlay-bar button,
        .map-overlay-bar a {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .map-overlay-bar button.active {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }

        .sidebar {
            width: 340px;
            max-width: 100%;
            height: 100%;
            background: #0f172a;
            border-left: 1px solid #334155;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        @media (max-width: 780px) {
            .layout {
                flex-direction: column;
            }
            .map-area {
                height: 55%;
            }
            .sidebar {
                width: 100%;
                height: 45%;
                border-left: none;
                border-top: 1px solid #334155;
            }
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .brand-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .logo-link {
            display: inline-block;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
        }

        .logo-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .quick-links {
            display: flex;
            gap: 5px;
        }

        .quick-links a {
            background: #0f172a;
            color: #facc15;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 7px;
            font-size: 0.74rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        .box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
        }

        .utc-clock {
            font-size: 1.15rem;
            font-weight: 800;
            color: #38bdf8;
            margin-top: 4px;
        }

        .hover-clock {
            font-size: 0.92rem;
            font-weight: 700;
            color: #39ff14;
            margin-top: 6px;
        }

        .local-clock {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4ade80;
            margin-top: 4px;
        }

        .label-muted {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .place-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #facc15;
        }

        .search-form {
            display: flex;
            gap: 6px;
        }

        .search-form input {
            flex: 1;
            min-width: 0;
            background: #0f172a;
            color: #ffffff;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        .search-form button {
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 6px 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .utc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 6px;
        }

        .utc-btn {
            background: #0f172a;
            color: #e2e8f0;
            border: 1px solid #334155;
            border-radius: 5px;
            padding: 5px 4px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
        }

        .utc-btn:hover, .utc-btn.selected {
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
        }

        .btn-open-pos {
            width: 100%;
            margin-top: 8px;
            background: #16a34a;
            color: #ffffff;
            border: 1px solid #86efac;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-open-pos:hover {
            background: #15803d;
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="map-area">
            <div id="map"></div>
            <div class="map-overlay-bar">
                <button type="button" id="btn-grid" onclick="toggleGrid()">Griglia 15°</button>
                <button type="button" id="btn-bands" onclick="toggleBands()">Fasce UTC</button>
                <button type="button" id="btn-countries" onclick="toggleCountries()">Paesi Geo</button>
                <button type="button" onclick="map.setView([20, 0], 2)">Vista Globale</button>
            </div>
        </div>

        <aside class="sidebar">
            <div class="brand-header">
                <div class="brand-left">
                    <a href="https://www.cavanweb.com/" target="_blank" class="logo-link" title="Visita CavanWeb">
                        <img src="SfondoN-512.png" alt="CavanWeb Logo">
                    </a>
                    <span class="place-name">SunClock24</span>
                </div>
                <div class="quick-links">
                    <a href="https://cavannastefano-sudo.github.io/OpenMeteo/openwmap2.html" target="_blank" title="Apri MeteoCWEB"><i class="fa-solid fa-cloud-sun"></i> Meteo</a>
                    <a href="https://cavannastefano-sudo.github.io/lista.m3u/" target="_blank" title="Apri IPTV"><i class="fa-solid fa-tv"></i> IPTV</a>
                    <a href="index.html">🏠 Indietro</a>
                </div>
            </div>

            <div class="box">
                <div class="label-muted">Ora di riferimento UTC</div>
                <div id="utc-now" class="utc-clock">--:--:-- UTC</div>
                <div id="header-time-display" class="hover-clock">Passa il mouse sulla mappa...</div>
                <div id="status-msg" class="label-muted">Clicca su una località per selezionarla o attiva i livelli desiderati.</div>
            </div>

            <div class="box">
                <div id="selected-place" class="place-name">Italia - Piacenza</div>
                <div id="selected-coords" class="label-muted">45.05°N, 9.69°E • Europe/Rome</div>
                <div id="selected-local-time" class="local-clock">--:--:--</div>
                <div id="selected-offset" class="label-muted">Scostamento: UTC+1</div>
                <button type="button" class="btn-open-pos" onclick="openSelectedInPosition()">☀️ Apri in Orologio Posizione</button>
            </div>

            <form class="search-form" onsubmit="event.preventDefault(); searchCity();">
                <input id="city-input" type="text" placeholder="Cerca città (es. Tokyo, New York)..." />
                <button type="submit">Cerca</button>
            </form>

            <div class="box">
                <div class="label-muted">Fusi / Scostamenti rapidi</div>
                <div id="utc-grid" class="utc-grid"></div>
            </div>
        </aside>
    </div>

    <script>
        const chiara = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        });

        const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OpenStreetMap contributors | Map style: &copy; OpenTopoMap'
        });

        const savedLayerName = localStorage.getItem('sunclock_map_layer');
        const initialLayer = (savedLayerName === 'Topografica') ? topo : chiara;

        const map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            minZoom: 2,
            maxZoom: 12,
            layers: [initialLayer]
        });

        const baseMaps = {
            "Mappa Chiara": chiara,
            "Topografica": topo
        };
        L.control.layers(baseMaps).addTo(map);

        const gridGroup = L.layerGroup();
        const bandsGroup = L.layerGroup();
        let geojsonLayer = null;

        let showGrid = localStorage.getItem('sunclock_layer_grid') === 'true';
        let showBands = localStorage.getItem('sunclock_layer_bands') === 'true';
        let showCountries = localStorage.getItem('sunclock_layer_countries') === 'true';

        let currentHoverLat = null;
        let currentHoverLon = null;

        // Palette simile allo screenshot (blu/indaco -> verde -> ocra/arancio) senza tinte simili tra zone vicine
        const SCREENSHOT_PALETTE = [
            '#3b5bdb', '#1c7ed6', '#15aabf', '#12b886', '#40c057',
            '#82c91e', '#fab005', '#fd7e14', '#5c7cfa', '#22b8cf',
            '#20c997', '#51cf66', '#94d82d', '#fcc419', '#ff922b',
            '#4c6ef5', '#1098ad', '#0ca678', '#37b24d', '#74b816',
            '#f59f00', '#e8590c', '#339af0', '#2b8a3e', '#d9480f'
        ];

        function getColor(name) {
            let hash = 0;
            const str = String(name || 'Sconosciuto');
            for (let i = 0; i < str.length; i++) {
                hash = ((hash * 31) + str.charCodeAt(i)) >>> 0;
            }
            const idx = (hash * 7) % SCREENSHOT_PALETTE.length;
            return SCREENSHOT_PALETTE[idx];
        }

        // Griglia 15° (aggiunta solo se selezionata)
        for (let lon = -180; lon <= 180; lon += 15) {
            L.polyline([[-85, lon], [85, lon]], {
                color: lon === 0 ? '#facc15' : '#64748b',
                weight: lon === 0 ? 2 : 1,
                opacity: 0.55,
                dashArray: lon === 0 ? null : '4 4'
            }).addTo(gridGroup);
        }
        for (let lat = -75; lat <= 75; lat += 15) {
            L.polyline([[lat, -180], [lat, 180]], {
                color: lat === 0 ? '#facc15' : '#94a3b8',
                weight: lat === 0 ? 1.5 : 0.9,
                opacity: 0.45
            }).addTo(gridGroup);
        }

        if (showGrid) {
            gridGroup.addTo(map);
            document.getElementById('btn-grid').classList.add('active');
        }

        // Livello fusi stile immagine: overlay immagine locale se presente + confini GeoJSON non dritti (zero rettangoli dritti)
        const imageBounds = [[-85, -180], [85, 180]];
        const screenshotOverlay = L.imageOverlay('fusi-orari.png', imageBounds, {
            opacity: 0.55,
            interactive: false
        });

        fetch('https://raw.githubusercontent.com/evansiroky/timezone-boundary-builder/master/dist/timezones-now.geojson')
            .then(res => {
                if (!res.ok) throw new Error('Errore caricamento confini fusi');
                return res.json();
            })
            .then(data => {
                bandsGroup.clearLayers();
                L.geoJSON(data, {
                    style: (feature) => {
                        const zoneName = (feature.properties && (feature.properties.tzid || feature.properties.name || feature.properties.zone)) || 'tz';
                        return {
                            color: '#334155',
                            weight: 1.1,
                            opacity: 0.85,
                            fillColor: getColor(zoneName),
                            fillOpacity: 0.36
                        };
                    },
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            handleMapClick(e.latlng.lat, e.latlng.lng);
                        });
                    }
                }).addTo(bandsGroup);

                screenshotOverlay.addTo(bandsGroup);

                if (showBands) {
                    bandsGroup.addTo(map);
                }
            })
            .catch(() => {
                // Nessun rettangolo dritto: usa solo l'overlay immagine se disponibile
                bandsGroup.clearLayers();
                screenshotOverlay.addTo(bandsGroup);
                if (showBands) {
                    bandsGroup.addTo(map);
                }
            });

        if (showBands) {
            document.getElementById('btn-bands').classList.add('active');
        }

        function toggleGrid() {
            showGrid = !showGrid;
            localStorage.setItem('sunclock_layer_grid', showGrid);
            document.getElementById('btn-grid').classList.toggle('active', showGrid);
            if (showGrid) gridGroup.addTo(map);
            else map.removeLayer(gridGroup);
        }

        function toggleBands() {
            showBands = !showBands;
            localStorage.setItem('sunclock_layer_bands', showBands);
            document.getElementById('btn-bands').classList.toggle('active', showBands);
            if (showBands) bandsGroup.addTo(map);
            else map.removeLayer(bandsGroup);
        }

        function toggleCountries() {
            showCountries = !showCountries;
            localStorage.setItem('sunclock_layer_countries', showCountries);
            document.getElementById('btn-countries').classList.toggle('active', showCountries);
            if (!geojsonLayer) return;
            if (showCountries) geojsonLayer.addTo(map);
            else map.removeLayer(geojsonLayer);
        }

        function getPreciseStandardTimezone(lat, lon) {
            if (lat >= 65.4 && lat <= 66.2 && lon >= -169.5 && lon <= -168.3) {
                if (lon < -168.9) {
                    return 12;
                } else {
                    return -9;
                }
            }

            if (lat >= 36.9 && lat <= 42.2 && lon >= -9.5 && lon <= -6.0) return 0;
            if (lat >= 51.4 && lat <= 55.5 && lon >= -10.7 && lon <= -5.3) return 0;
            if (lat >= 36.0 && lat <= 43.8 && lon >= -9.3 && lon <= 3.4) return 1;
            if (lat >= 42.3 && lat <= 51.1 && lon >= -5.1 && lon <= 8.3) return 1;

            try {
                if (typeof tzlookup === 'function') {
                    const tzString = tzlookup(lat, lon);
                    const now = new Date();
                    const janDate = new Date(now.getFullYear(), 0, 15);

                    const dtf = new Intl.DateTimeFormat('en-US', {
                        timeZone: tzString,
                        timeZoneName: 'shortOffset'
                    });
                    const parts = dtf.formatToParts(janDate);
                    const offsetPart = parts.find(p => p.type === 'timeZoneName');
                    if (offsetPart) {
                        const match = offsetPart.value.match(/GMT([+-]\d+)(?::(\d+))?/);
                        if (match) {
                            const hours = parseInt(match[1], 10);
                            const minutes = match[2] ? parseInt(match[2], 10) / 60 : 0;
                            return hours + (hours < 0 ? -minutes : minutes);
                        }
                    }
                }
            } catch (e) {}

            return Math.round(lon / 15);
        }

        function getCurrentDstStateForCoords(lat, lon, date) {
            const isAuto = localStorage.getItem('sunclock_auto_dst') !== 'false';
            if (isAuto && !isNaN(lat) && !isNaN(lon)) {
                try {
                    if (typeof tzlookup === 'function') {
                        const tzString = tzlookup(lat, lon);
                        if (tzString.startsWith('Africa/')) return false;

                        const dtf = new Intl.DateTimeFormat('en-US', {
                            timeZone: tzString,
                            timeZoneName: 'shortOffset'
                        });
                        const parts = dtf.formatToParts(date);
                        const offsetPart = parts.find(p => p.type === 'timeZoneName');
                        if (offsetPart) {
                            const match = offsetPart.value.match(/GMT([+-]\d+)(?::(\d+))?/);
                            if (match) {
                                const currentOffset = parseInt(match[1], 10);
                                const standardBaseOffset = getPreciseStandardTimezone(lat, lon);
                                return currentOffset > standardBaseOffset;
                            }
                        }
                    }
                } catch (e) {}
            }
            return localStorage.getItem('sunclock_dst') === 'true';
        }

        function isDstActiveForCoords(lat, lon) {
            return getCurrentDstStateForCoords(lat, lon, new Date());
        }

        function getTimeForCoordinates(lat, lon) {
            const now = new Date();

            if (lat >= 65.4 && lat <= 66.2 && lon >= -169.5 && lon <= -168.3) {
                const targetTz = (lon < -168.9) ? 'Asia/Anadyr' : 'America/Nome';
                try {
                    const options = {
                        timeZone: targetTz,
                        hour: '2-digit', minute: '2-digit', second: '2-digit',
                        year: 'numeric', month: '2-digit', day: '2-digit',
                        hour12: false
                    };
                    const formatter = new Intl.DateTimeFormat('it-IT', options);
                    const parts = formatter.formatToParts(now);
                    let timeObj = {};
                    parts.forEach(p => { timeObj[p.type] = p.value; });
                    return {
                        timeStr: `${timeObj.hour}:${timeObj.minute}:${timeObj.second}`,
                        dateStr: `${timeObj.day}/${timeObj.month}/${timeObj.year}`
                    };
                } catch (e) {}
            }

            try {
                if (typeof tzlookup === 'function') {
                    const tzString = tzlookup(lat, lon);
                    const options = {
                        timeZone: tzString,
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour12: false
                    };
                    const formatter = new Intl.DateTimeFormat('it-IT', options);
                    const parts = formatter.formatToParts(now);

                    let timeObj = {};
                    parts.forEach(p => { timeObj[p.type] = p.value; });

                    return {
                        timeStr: `${timeObj.hour}:${timeObj.minute}:${timeObj.second}`,
                        dateStr: `${timeObj.day}/${timeObj.month}/${timeObj.year}`
                    };
                }
            } catch (e) {}

            let normalizedLon = ((lon + 180) % 360 + 360) % 360 - 180;
            const hoursOffset = Math.round(normalizedLon / 15);
            const targetTime = new Date(now.getTime() + (hoursOffset * 3600000));

            return {
                timeStr: targetTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'UTC' }),
                dateStr: targetTime.toLocaleDateString('it-IT', { timeZone: 'UTC' })
            };
        }

        let currentLat = 45.0526;
        let currentLon = 9.6930;
        let currentName = 'Italia - Piacenza';
        let currentTz = 'Europe/Rome';

        const marker = L.circleMarker([currentLat, currentLon], {
            radius: 7,
            color: '#ffffff',
            weight: 2,
            fillColor: '#ff007f',
            fillOpacity: 1
        }).addTo(map);

        map.on('mousemove', (e) => {
            currentHoverLat = e.latlng.lat;
            currentHoverLon = e.latlng.lng;
            updateHeaderTime();
        });

        map.on('mouseout', () => {
            currentHoverLat = null;
            currentHoverLon = null;
            const headerDisplay = document.getElementById('header-time-display');
            if (headerDisplay) {
                headerDisplay.textContent = 'Passa il mouse sulla mappa...';
            }
        });

        function updateHeaderTime() {
            const now = new Date();
            document.getElementById('utc-now').textContent = now.toISOString().slice(11, 19) + ' UTC';

            if (currentHoverLat !== null && currentHoverLon !== null) {
                const localInfo = getTimeForCoordinates(currentHoverLat, currentHoverLon);
                const headerDisplay = document.getElementById('header-time-display');
                if (headerDisplay) {
                    headerDisplay.textContent = `📅 ${localInfo.dateStr} ⏰ ${localInfo.timeStr}`;
                }
            }

            try {
                const selStr = new Intl.DateTimeFormat('it-IT', {
                    timeZone: currentTz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                }).format(now);
                document.getElementById('selected-local-time').textContent = selStr;
            } catch (e) {
                document.getElementById('selected-local-time').textContent = '--:--:--';
            }
        }

        function handleMapClick(lat, lon, autoNavigate = true) {
            currentLat = lat;
            currentLon = lon;
            marker.setLatLng([lat, lon]);

            try {
                currentTz = (lat >= 65.4 && lat <= 66.2 && lon >= -169.5 && lon <= -168.3)
                    ? ((lon < -168.9) ? 'Asia/Anadyr' : 'America/Nome')
                    : (typeof tzlookup === 'function' ? (tzlookup(lat, lon) || 'UTC') : 'UTC');
            } catch (e) {
                currentTz = 'UTC';
            }

            const stdOffset = getPreciseStandardTimezone(lat, lon);
            const dstActive = isDstActiveForCoords(lat, lon);
            const effectiveOffset = stdOffset + (dstActive ? 1 : 0);
            const sign = effectiveOffset >= 0 ? '+' : '';
            document.getElementById('selected-offset').textContent = `Scostamento: UTC${sign}${effectiveOffset}`;
            document.getElementById('selected-coords').textContent = `${lat.toFixed(2)}°, ${lon.toFixed(2)}° • ${currentTz}`;
            document.getElementById('status-msg').textContent = 'Rilevamento località in corso...';

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=it`)
                .then(res => res.json())
                .then(geoData => {
                    let country = '';
                    let specificLocality = '';

                    if (geoData && geoData.address) {
                        country = geoData.address.country || '';
                        specificLocality = geoData.address.city ||
                                           geoData.address.town ||
                                           geoData.address.village ||
                                           geoData.address.municipality ||
                                           geoData.address.county ||
                                           geoData.address.state || '';
                    }

                    let fullName = 'Posizione';
                    if (country && specificLocality && specificLocality.toLowerCase() !== country.toLowerCase()) {
                        fullName = `${country} - ${specificLocality}`;
                    } else {
                        fullName = specificLocality || country || 'Posizione';
                    }

                    currentName = fullName;
                    document.getElementById('selected-place').textContent = fullName;
                    document.getElementById('status-msg').textContent = `Selezionato: ${fullName}`;

                    if (autoNavigate) {
                        const isAuto = localStorage.getItem('sunclock_auto_dst') !== 'false';
                        window.location.href = `posizione.html?lat=${lat}&lon=${lon}&city=${encodeURIComponent(fullName)}&auto=${isAuto}&dst=${dstActive}`;
                    }
                })
                .catch(() => {
                    currentName = 'Posizione';
                    document.getElementById('selected-place').textContent = 'Posizione';
                    document.getElementById('status-msg').textContent = 'Posizione rilevata (offline).';
                    if (autoNavigate) {
                        const isAuto = localStorage.getItem('sunclock_auto_dst') !== 'false';
                        window.location.href = `posizione.html?lat=${lat}&lon=${lon}&city=${encodeURIComponent('Posizione')}&auto=${isAuto}&dst=${dstActive}`;
                    }
                });
        }

        function openSelectedInPosition() {
            const activeDst = isDstActiveForCoords(currentLat, currentLon);
            const isAuto = localStorage.getItem('sunclock_auto_dst') !== 'false';
            window.location.href = `posizione.html?lat=${currentLat}&lon=${currentLon}&city=${encodeURIComponent(currentName)}&auto=${isAuto}&dst=${activeDst}`;
        }

        async function searchCity() {
            const q = document.getElementById('city-input').value.trim();
            if (!q) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=it&q=${encodeURIComponent(q)}`);
                const list = await res.json();
                if (Array.isArray(list) && list.length > 0) {
                    const lat = parseFloat(list[0].lat);
                    const lon = parseFloat(list[0].lon);
                    map.setView([lat, lon], 6);
                    handleMapClick(lat, lon, false);
                }
            } catch (e) {}
        }

        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
            .then(res => res.json())
            .then(data => {
                geojsonLayer = L.geoJSON(data, {
                    style: (feature) => ({
                        fillColor: getColor(feature.properties.ADMIN || feature.properties.name || "Sconosciuto"),
                        weight: 1,
                        opacity: 0.8,
                        color: '#333',
                        fillOpacity: 0.55
                    }),
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            handleMapClick(e.latlng.lat, e.latlng.lng, true);
                        });
                    }
                });

                if (showCountries) {
                    geojsonLayer.addTo(map);
                    document.getElementById('btn-countries').classList.add('active');
                }

                document.getElementById('status-msg').textContent = "Clicca su una località per selezionarla.";
            })
            .catch(() => {
                document.getElementById('status-msg').textContent = "Errore nel caricamento confini. Clicca comunque sulla mappa.";
            });

        map.on('baselayerchange', function(e) {
            localStorage.setItem('sunclock_map_layer', e.name);
        });

        map.on('click', (e) => {
            handleMapClick(e.latlng.lat, e.latlng.lng, true);
        });

        const quickOffsets = [
            { label: 'UTC-9', lat: 65.75, lon: -168.7, city: 'Stati Uniti - Piccola Diomede' },
            { label: 'UTC-5', lat: 40.71, lon: -74.01, city: 'Stati Uniti - New York' },
            { label: 'UTC-3', lat: -23.55, lon: -46.63, city: 'Brasile - San Paolo' },
            { label: 'UTC+0', lat: 51.51, lon: -0.13, city: 'Regno Unito - Londra' },
            { label: 'UTC+1', lat: 45.05, lon: 9.69, city: 'Italia - Piacenza' },
            { label: 'UTC+2', lat: 30.04, lon: 31.24, city: 'Egitto - Il Cairo' },
            { label: 'UTC+3', lat: 55.75, lon: 37.62, city: 'Russia - Mosca' },
            { label: 'UTC+5:30', lat: 28.61, lon: 77.21, city: 'India - Nuova Delhi' },
            { label: 'UTC+8', lat: 39.90, lon: 116.41, city: 'Cina - Pechino' },
            { label: 'UTC+9', lat: 35.68, lon: 139.65, city: 'Giappone - Tokyo' },
            { label: 'UTC+10', lat: -33.87, lon: 151.21, city: 'Australia - Sydney' },
            { label: 'UTC+12', lat: 65.78, lon: -169.0, city: 'Russia - Grande Diomede' }
        ];

        const gridContainer = document.getElementById('utc-grid');
        quickOffsets.forEach(item => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'utc-btn';
            btn.textContent = item.label;
            btn.onclick = () => {
                map.setView([item.lat, item.lon], 4);
                handleMapClick(item.lat, item.lon, false);
            };
            gridContainer.appendChild(btn);
        });

        handleMapClick(currentLat, currentLon, false);
        updateHeaderTime();
        setInterval(updateHeaderTime, 1000);
    </script>
</body>
</html>
