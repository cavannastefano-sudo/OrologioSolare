<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Mondiale - SunClock24</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/jpeg" href="IMG_20260808_102945.jpg">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { background-color: #000; font-family: sans-serif; color: #facc15; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { margin: 0; font-size: 1.2rem; text-shadow: 0 0 6px #ff0000; }
        .back-btn { background: rgba(0,0,0,0.3); color: #39ff14; border: 1px solid #ff0000; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        .back-btn:hover { background: rgba(0,0,0,0.5); }
        #map { width: 100%; max-width: 800px; height: 70vh; border-radius: 12px; border: 2px solid #334155; }
        #status-msg { margin-top: 12px; color: #38bdf8; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>🌍 Mappa Mondiale</h1>
        <a href="index.html" class="back-btn">← Torna all'Orologio</a>
    </header>

    <div id="map"></div>
    <div id="status-msg">Caricamento confini in corso...</div>

    <script>
        // Definiamo i layer disponibili
        const standard = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CartoDB',
            maxZoom: 19
        });

        const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
        });

        // Creiamo la mappa impostando il layer topografico come predefinito
        const map = L.map('map', {
            center: [20, 0],
            zoom: 2,
            layers: [topo] 
        });

        // Aggiungiamo il controllo per selezionare i layer in alto a destra
        const baseMaps = {
            "Topografica": topo,
            "Mappa Scura": standard
        };
        L.control.layers(baseMaps).addTo(map);

        // Genera un colore HSL luminoso basato sul nome del paese
        function getColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            // Saturazione 70%, Luminosità 55% per colori accesi
            return `hsl(${hash % 360}, 70%, 55%)`;
        }

        function handleMapClick(lat, lon) {
            document.getElementById('status-msg').innerText = "Rilevamento località in corso...";

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=it`)
                .then(res => res.json())
                .then(geoData => {
                    let country = '';
                    let city = '';
                    
                    if (geoData && geoData.address) {
                        country = geoData.address.country || '';
                        city = geoData.address.city || geoData.address.town || geoData.address.village || geoData.address.county || '';
                    }
                    
                    let fullName = 'Posizione';
                    if (country && city && city.toLowerCase() !== country.toLowerCase()) {
                        fullName = `${country} - ${city}`;
                    } else {
                        fullName = city || country || 'Posizione';
                    }

                    window.location.href = `posizione.html?lat=${lat}&lon=${lon}&city=${encodeURIComponent(fullName)}`;
                })
                .catch(() => {
                    window.location.href = `posizione.html?lat=${lat}&lon=${lon}&city=${encodeURIComponent('Posizione')}`;
                });
        }

        // Carica i confini dei paesi e applica lo stile luminoso
        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: (feature) => ({
                        fillColor: getColor(feature.properties.ADMIN || feature.properties.name),
                        weight: 1.5,          // Bordi più spessi
                        opacity: 1,           // Bordi non trasparenti
                        color: '#ffffff',     // Bordi BIANCHI e luminosi
                        fillOpacity: 0.4      // Riempimento più colorato (40%)
                    }),
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            // Previene il trigger del click sulla mappa sottostante
                            L.DomEvent.stopPropagation(e); 
                            handleMapClick(e.latlng.lat, e.latlng.lng);
                        });
                    }
                }).addTo(map);
                document.getElementById('status-msg').innerText = "Clicca su uno stato per selezionarlo.";
            })
            .catch(() => {
                document.getElementById('status-msg').innerText = "Errore nel caricamento confini. Clicca comunque sulla mappa.";
            });

        // Click sulla mappa (aree marine o dove non ci sono stati caricati)
        map.on('click', (e) => {
            handleMapClick(e.latlng.lat, e.latlng.lng);
        });
    </script>
</body>
</html>
