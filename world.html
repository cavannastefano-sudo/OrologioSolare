<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Fusi Orari - SunClock24</title>
    <meta name="theme-color" content="#000000">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { background-color: #000; font-family: sans-serif; color: #facc15; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { margin: 0; font-size: 1.2rem; text-shadow: 0 0 6px #ff0000; }
        .back-btn { background: rgba(0,0,0,0.3); color: #39ff14; border: 1px solid #ff0000; padding: 6px 12px; border-radius: 6px; text-decoration: none; }
        #map { width: 100%; max-width: 800px; height: 70vh; border-radius: 12px; border: 2px solid #334155; }
        #status-msg { margin-top: 12px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>🌍 Mappa Fusi Orari</h1>
        <a href="index.html" class="back-btn">← Torna</a>
    </header>

    <div id="map"></div>
    <div id="status-msg">Caricamento fusi orari...</div>

    <script>
        const map = L.map('map').setView([20, 0], 2);

        // Mappa base scura
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CartoDB'
        }).addTo(map);

        // URL del dataset GeoJSON dei fusi orari (Natural Earth via GitHub)
        const tzUrl = 'https://raw.githubusercontent.com/evansiroky/timezone-boundary-builder/master/combined.json';

        // Poiché il file dei fusi orari è molto grande, usiamo un dataset più leggero 
        // per il web, o carichiamo una versione semplificata
        fetch('https://raw.githubusercontent.com/datasets/timezone-boundary-builder/master/dist/combined-with-oceans.json')
            .catch(() => 'https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json') // Fallback
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        fillColor: '#38bdf8',
                        weight: 0.5,
                        opacity: 0.5,
                        color: '#facc15',
                        fillOpacity: 0.2
                    },
                    onEachFeature: (feature, layer) => {
                        layer.on('click', (e) => {
                            const lat = e.latlng.lat;
                            const lon = e.latlng.lng;
                            window.location.href = `posizione.html?lat=${lat}&lon=${lon}&city=FusoOrario`;
                        });
                    }
                }).addTo(map);
                document.getElementById('status-msg').innerText = "Clicca su una zona per selezionarla.";
            })
            .catch(() => {
                document.getElementById('status-msg').innerText = "Errore caricamento fusi.";
            });
    </script>
</body>
</html>
