<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Fusi Orari - SunClock24</title>
    <meta name="theme-color" content="#000000">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { background-color: #000; font-family: sans-serif; color: #facc15; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { margin: 0; font-size: 1.2rem; text-shadow: 0 0 6px #ff0000; }
        .back-btn { background: rgba(0,0,0,0.3); color: #39ff14; border: 1px solid #ff0000; padding: 6px 12px; border-radius: 6px; text-decoration: none; }
        #map { width: 100%; max-width: 800px; height: 70vh; border-radius: 12px; border: 2px solid #334155; }
        #status-msg { margin-top: 12px; color: #38bdf8; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>🌍 Mappa Fusi Orari</h1>
        <a href="index.html" class="back-btn">← Torna</a>
    </header>

    <div id="map"></div>
    <div id="status-msg">Clicca un punto per aprire la posizione.</div>

    <script>
        const map = L.map('map').setView([20, 0], 2);

        // Usiamo una tile map gratuita che mostra i fusi orari (Timezone map)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Aggiungiamo un overlay specifico per i fusi orari
        // Questa è una soluzione leggera basata su immagini tile
        L.tileLayer('https://timezone-map.org/tiles/{z}/{x}/{y}.png', {
            opacity: 0.5,
            attribution: '© Timezone-Map'
        }).addTo(map);

        let marker = L.marker([45.05, 9.69]).addTo(map);

        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(4);
            const lon = e.latlng.lng.toFixed(4);
            marker.setLatLng([lat, lon]);
            
            document.getElementById('status-msg').innerText = "Caricamento...";
            window.location.href = `posizione.html?lat=${lat}&lon=${lon}&city=Mappa`;
        });
    </script>
</body>
</html>
