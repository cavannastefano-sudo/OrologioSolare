<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SunClock24 - Mappa Fusi Orari</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/jpeg" href="IMG_20260808_102945.jpg">

    <!-- Libreria fuso orario da coordinate -->
    <script src="https://unpkg.com/tz-lookup@6.1.25/tz.js"></script>
    <script src="timezone-manager.js"></script>

    <style>
        :root {
            --bg-main: #020617;
            --panel-bg: rgba(15, 23, 42, 0.94);
            --border-color: #334155;
            --accent-cyan: #38bdf8;
            --accent-green: #39ff14;
            --accent-yellow: #facc15;
            --accent-pink: #ff007f;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-main);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100dvh;
            padding: 8px;
            gap: 8px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 20;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: #0f172a;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.84rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }

        .btn-nav:hover {
            background: #0284c7;
            color: #ffffff;
            border-color: #e0f2fe;
        }

        .page-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent-yellow);
            letter-spacing: 0.3px;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 3px 6px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }

        .btn-zoom {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 5px;
            min-width: 30px;
            height: 28px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
        }

        .btn-zoom:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .zoom-readout {
            min-width: 48px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .search-row {
            display: flex;
            gap: 6px;
            z-index: 20;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 7px;
            padding: 7px 10px;
            font-size: 0.88rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
        }

        .btn-search {
            background: #2563eb;
            color: #ffffff;
            border: 1px solid #93c5fd;
            border-radius: 7px;
            padding: 0 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: #1d4ed8;
        }

        .map-viewport {
            position: relative;
            flex: 1;
            min-height: 220px;
            width: 100%;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background: #030712;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
        }

        .map-viewport.dragging {
            cursor: grabbing;
        }

        #mapCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .map-status-banner {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(2, 6, 23, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #cbd5e1;
            font-size: 0.73rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 5;
        }

        .crosshair-badge {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(2, 6, 23, 0.86);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #e2e8f0;
            font-size: 0.74rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 5;
        }

        .info-card {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 9px 11px;
            display: flex;
            flex-direction: column;
            gap: 7px;
            z-index: 20;
            box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.65);
        }

        .info-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .place-title {
            font-size: 0.98rem;
            font-weight: 800;
            color: var(--accent-yellow);
        }

        .tz-pill {
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 0.8rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 999px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            font-size: 0.8rem;
        }

        .info-box {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid #334155;
            border-radius: 7px;
            padding: 5px 7px;
        }

        .info-box small {
            display: block;
            color: #94a3b8;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .info-box strong {
            color: var(--accent-green);
            font-size: 0.86rem;
        }

        .actions-row {
            display: flex;
            gap: 8px;
        }

        .btn-primary-open {
            flex: 1;
            background: #16a34a;
            color: #ffffff;
            border: 1px solid #86efac;
            border-radius: 7px;
            padding: 8px 12px;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-primary-open:hover {
            background: #15803d;
        }

        .btn-gps {
            background: #0f172a;
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
            border-radius: 7px;
            padding: 8px 11px;
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-gps:hover {
            background: rgba(250, 204, 21, 0.14);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="top-bar">
            <div class="nav-group">
                <a href="index.html" class="btn-nav">🏠 Home</a>
                <span class="page-title">🌍 Fusi Orari</span>
            </div>

            <div class="zoom-controls">
                <button type="button" class="btn-zoom" onclick="zoomBy(1 / 1.35)" title="Zoom indietro">−</button>
                <span id="zoom-readout" class="zoom-readout">100%</span>
                <button type="button" class="btn-zoom" onclick="zoomBy(1.35)" title="Zoom avanti">+</button>
                <button type="button" class="btn-zoom" onclick="resetZoom()" title="Ripristina vista">1:1</button>
            </div>
        </div>

        <div class="search-row">
            <input type="text" id="city-search" class="search-input" placeholder="Cerca località (es. Piacenza, Tokyo, New York, Londra)..." onkeydown="if (event.key === 'Enter') searchPlace();">
            <button type="button" class="btn-search" onclick="searchPlace()">Cerca</button>
        </div>

        <div id="map-viewport" class="map-viewport">
            <div id="map-status" class="map-status-banner">Caricamento mappa time-zones3000.gif...</div>
            <canvas id="mapCanvas"></canvas>
            <div id="hover-coords" class="crosshair-badge">Puntatore: --.--°, --.--°</div>
        </div>

        <div class="info-card">
            <div class="info-top">
                <div id="selected-place-name" class="place-title">Piacenza</div>
                <div id="selected-tz-badge" class="tz-pill">UTC+1 • Europe/Rome</div>
            </div>

            <div class="info-grid">
                <div class="info-box">
                    <small>Coordinate</small>
                    <strong id="selected-coords">45.05°N, 9.69°E</strong>
                </div>
                <div class="info-box">
                    <small>Ora locale stimata</small>
                    <strong id="selected-local-time">--:--:--</strong>
                </div>
                <div class="info-box">
                    <small>Offset attuale</small>
                    <strong id="selected-offset">UTC +1</strong>
                </div>
            </div>

            <div class="actions-row">
                <button type="button" class="btn-gps" onclick="useCurrentGps()">📍 Mia posizione</button>
                <button type="button" class="btn-primary-open" onclick="openInPositionClock()">☀️ Apri in Orologio Posizione</button>
            </div>
        </div>
    </div>

    <script>
        const MAP_IMAGE_URL = 'https://carte-monde.org/wp-content/uploads/2016/09/time-zones3000.gif';

        const params = new URLSearchParams(window.location.search);
        let selectedLat = params.get('lat') ? parseFloat(params.get('lat')) : 45.05;
        let selectedLon = params.get('lon') ? parseFloat(params.get('lon')) : 9.69;
        let selectedName = params.get('city') ? decodeURIComponent(params.get('city')) : 'Piacenza';
        let selectedTz = 'Europe/Rome';
        let selectedOffsetHours = 1;

        const QUICK_CITIES = [
            { name: 'Piacenza', lat: 45.0526, lon: 9.6930 },
            { name: 'Roma', lat: 41.9028, lon: 12.4964 },
            { name: 'Milano', lat: 45.4642, lon: 9.1900 },
            { name: 'Londra', lat: 51.5072, lon: -0.1276 },
            { name: 'New York', lat: 40.7128, lon: -74.0060 },
            { name: 'Los Angeles', lat: 34.0522, lon: -118.2437 },
            { name: 'Tokyo', lat: 35.6762, lon: 139.6503 },
            { name: 'Sydney', lat: -33.8688, lon: 151.2093 },
            { name: 'Rio de Janeiro', lat: -22.9068, lon: -43.1729 },
            { name: 'Il Cairo', lat: 30.0444, lon: 31.2357 },
            { name: 'Reykjavik', lat: 64.1466, lon: -21.9426 },
            { name: 'Auckland', lat: -36.8485, lon: 174.7633 }
        ];

        const viewport = document.getElementById('map-viewport');
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const statusBanner = document.getElementById('map-status');

        const mapImg = new Image();
        mapImg.crossOrigin = 'anonymous';
        let mapLoaded = false;

        let scale = 1.0;
        const minScale = 1.0;
        const maxScale = 12.0;
        let offsetX = 0;
        let offsetY = 0;

        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let pointerDownX = 0;
        let pointerDownY = 0;
        let movedDuringDrag = false;
        let activePointers = new Map();
        let lastPinchDist = null;

        // Calcola il rettangolo base in cui l'immagine è adattata dentro il canvas (letterbox/cover bilanciato)
        function getBaseMapRect() {
            const cw = canvas.width;
            const ch = canvas.height;
            if (!mapLoaded || !mapImg.naturalWidth || !mapImg.naturalHeight) {
                return { x: 0, y: 0, w: cw, h: ch };
            }

            const imgRatio = mapImg.naturalWidth / mapImg.naturalHeight;
            const canvasRatio = cw / ch;

            let baseW = cw;
            let baseH = ch;
            if (imgRatio > canvasRatio) {
                baseW = cw;
                baseH = cw / imgRatio;
            } else {
                baseH = ch;
                baseW = ch * imgRatio;
            }

            return {
                x: (cw - baseW) / 2,
                y: (ch - baseH) / 2,
                w: baseW,
                h: baseH
            };
        }

        function clampPan() {
            const cw = canvas.width;
            const ch = canvas.height;
            const base = getBaseMapRect();
            const mapW = base.w * scale;
            const mapH = base.h * scale;

            if (mapW <= cw) {
                offsetX = (cw - mapW) / 2 - base.x;
            } else {
                const minOffsetX = -base.x - (mapW - cw);
                const maxOffsetX = -base.x;
                if (offsetX > maxOffsetX) offsetX = maxOffsetX;
                if (offsetX < minOffsetX) offsetX = minOffsetX;
            }

            if (mapH <= ch) {
                offsetY = (ch - mapH) / 2 - base.y;
            } else {
                const minOffsetY = -base.y - (mapH - ch);
                const maxOffsetY = -base.y;
                if (offsetY > maxOffsetY) offsetY = maxOffsetY;
                if (offsetY < minOffsetY) offsetY = minOffsetY;
            }
        }

        function setZoomAtPoint(newScale, clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const px = (clientX - rect.left) * (canvas.width / rect.width);
            const py = (clientY - rect.top) * (canvas.height / rect.height);

            const clamped = Math.max(minScale, Math.min(maxScale, newScale));
            const ratio = clamped / scale;

            offsetX = px - (px - offsetX) * ratio;
            offsetY = py - (py - offsetY) * ratio;
            scale = clamped;

            clampPan();
            updateZoomReadout();
            drawMap();
        }

        function zoomBy(factor) {
            const rect = canvas.getBoundingClientRect();
            setZoomAtPoint(scale * factor, rect.left + rect.width / 2, rect.top + rect.height / 2);
        }

        function resetZoom() {
            scale = 1.0;
            offsetX = 0;
            offsetY = 0;
            clampPan();
            updateZoomReadout();
            drawMap();
        }

        function updateZoomReadout() {
            document.getElementById('zoom-readout').innerText = `${Math.round(scale * 100)}%`;
        }

        function resizeCanvas() {
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const rect = viewport.getBoundingClientRect();
            const prevW = canvas.width || rect.width * dpr;
            const prevH = canvas.height || rect.height * dpr;

            canvas.width = Math.max(1, Math.round(rect.width * dpr));
            canvas.height = Math.max(1, Math.round(rect.height * dpr));

            if (prevW > 0 && prevH > 0) {
                offsetX = offsetX * (canvas.width / prevW);
                offsetY = offsetY * (canvas.height / prevH);
            }
            clampPan();
            drawMap();
        }

        // Converte coordinate geografiche (lat/lon) in coordinate schermo (px/py) sulla mappa
        function latLonToScreen(lat, lon) {
            const base = getBaseMapRect();
            const mapW = base.w * scale;
            const mapH = base.h * scale;
            const relX = ((lon + 180) / 360) * mapW;
            const relY = ((90 - lat) / 180) * mapH;
            return {
                x: base.x + offsetX + relX,
                y: base.y + offsetY + relY
            };
        }

        // Converte coordinate schermo (px/py) in coordinate geografiche (lat/lon)
        function screenToLatLon(px, py) {
            const base = getBaseMapRect();
            const mapW = base.w * scale;
            const mapH = base.h * scale;
            const relX = (px - (base.x + offsetX)) / mapW;
            const relY = (py - (base.y + offsetY)) / mapH;

            const clampedX = Math.max(0, Math.min(1, relX));
            const clampedY = Math.max(0, Math.min(1, relY));

            const lon = clampedX * 360 - 180;
            const lat = 90 - clampedY * 180;
            return {
                lat: Math.max(-85, Math.min(85, lat)),
                lon: Math.max(-180, Math.min(180, lon)),
                insideMap: relX >= 0 && relX <= 1 && relY >= 0 && relY <= 1
            };
        }

        function resolveTimezoneInfo(lat, lon) {
            let tzName = 'UTC';
            try {
                if (typeof tzlookup === 'function') {
                    tzName = tzlookup(lat, lon) || 'UTC';
                }
            } catch (e) {
                tzName = 'UTC';
            }

            let offsetHours = Math.round(lon / 15);
            try {
                const now = new Date();
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZone: tzName,
                    timeZoneName: 'shortOffset'
                }).formatToParts(now);
                const tzPart = parts.find(p => p.type === 'timeZoneName');
                if (tzPart) {
                    const m = tzPart.value.match(/GMT([+-]\d+)(?::(\d+))?/);
                    if (m) {
                        const h = parseInt(m[1], 10);
                        const min = m[2] ? parseInt(m[2], 10) / 60 : 0;
                        offsetHours = h + (h < 0 ? -min : min);
                    }
                }
            } catch (e) {
                offsetHours = Math.round(lon / 15);
            }

            return { tzName, offsetHours };
        }

        function formatOffset(offsetHours) {
            const sign = offsetHours >= 0 ? '+' : '-';
            const abs = Math.abs(offsetHours);
            const h = Math.floor(abs);
            const m = Math.round((abs - h) * 60);
            return m > 0 ? `UTC ${sign}${h}:${String(m).padStart(2, '0')}` : `UTC ${sign}${h}`;
        }

        function updateInfoCard() {
            const info = resolveTimezoneInfo(selectedLat, selectedLon);
            selectedTz = info.tzName;
            selectedOffsetHours = info.offsetHours;

            const latDir = selectedLat >= 0 ? 'N' : 'S';
            const lonDir = selectedLon >= 0 ? 'E' : 'W';

            document.getElementById('selected-place-name').innerText = selectedName;
            document.getElementById('selected-tz-badge').innerText = `${formatOffset(selectedOffsetHours).replace(' ', '')} • ${selectedTz}`;
            document.getElementById('selected-coords').innerText = `${Math.abs(selectedLat).toFixed(2)}°${latDir}, ${Math.abs(selectedLon).toFixed(2)}°${lonDir}`;
            document.getElementById('selected-offset').innerText = formatOffset(selectedOffsetHours);
            updateLocalClockReadout();
        }

        function updateLocalClockReadout() {
            const now = new Date();
            const target = new Date(now.getTime() + selectedOffsetHours * 3600000);
            const hh = String(target.getUTCHours()).padStart(2, '0');
            const mm = String(target.getUTCMinutes()).padStart(2, '0');
            const ss = String(target.getUTCSeconds()).padStart(2, '0');
            document.getElementById('selected-local-time').innerText = `${hh}:${mm}:${ss}`;
        }

        function selectCoordinates(lat, lon, name, centerView = false) {
            selectedLat = Math.max(-85, Math.min(85, lat));
            selectedLon = Math.max(-180, Math.min(180, lon));
            selectedName = name || `Punto (${selectedLat.toFixed(2)}, ${selectedLon.toFixed(2)})`;

            if (centerView) {
                const base = getBaseMapRect();
                const mapW = base.w * scale;
                const mapH = base.h * scale;
                const relX = ((selectedLon + 180) / 360) * mapW;
                const relY = ((90 - selectedLat) / 180) * mapH;
                offsetX = canvas.width / 2 - (base.x + relX);
                offsetY = canvas.height / 2 - (base.y + relY);
                clampPan();
            }

            updateInfoCard();
            drawMap();
        }

        function drawMap() {
            const cw = canvas.width;
            const ch = canvas.height;
            ctx.clearRect(0, 0, cw, ch);

            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, cw, ch);

            const base = getBaseMapRect();
            const drawX = base.x + offsetX;
            const drawY = base.y + offsetY;
            const drawW = base.w * scale;
            const drawH = base.h * scale;

            if (mapLoaded) {
                ctx.imageSmoothingEnabled = scale < 2.2;
                ctx.drawImage(mapImg, drawX, drawY, drawW, drawH);
            } else {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(drawX, drawY, drawW, drawH);
            }

            // Segnaposto città principali
            QUICK_CITIES.forEach(c => {
                const pt = latLonToScreen(c.lat, c.lon);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.fill();
                ctx.strokeStyle = '#020617';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                if (scale >= 1.5 || c.name === 'Piacenza' || c.name === 'Roma' || c.name === 'New York' || c.name === 'Tokyo') {
                    ctx.font = 'bold 11px sans-serif';
                    ctx.textAlign = 'left';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = 'rgba(0,0,0,0.9)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(c.name, pt.x + 6, pt.y + 3);
                    ctx.shadowBlur = 0;
                }
            });

            // Marker punto selezionato
            const selPt = latLonToScreen(selectedLat, selectedLon);
            ctx.beginPath();
            ctx.arc(selPt.x, selPt.y, 12, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 0, 127, 0.55)';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(selPt.x, selPt.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#ff007f';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.8;
            ctx.stroke();
        }

        function handleMapTap(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const px = (clientX - rect.left) * (canvas.width / rect.width);
            const py = (clientY - rect.top) * (canvas.height / rect.height);
            const ll = screenToLatLon(px, py);

            let matchedCity = null;
            for (const c of QUICK_CITIES) {
                const pt = latLonToScreen(c.lat, c.lon);
                if (Math.hypot(pt.x - px, pt.y - py) < 18) {
                    matchedCity = c;
                    break;
                }
            }

            if (matchedCity) {
                selectCoordinates(matchedCity.lat, matchedCity.lon, matchedCity.name, false);
            } else {
                selectCoordinates(ll.lat, ll.lon, null, false);
            }
        }

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.22 : 1 / 1.22;
            setZoomAtPoint(scale * factor, e.clientX, e.clientY);
        }, { passive: false });

        viewport.addEventListener('pointerdown', (e) => {
            viewport.setPointerCapture(e.pointerId);
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size === 1) {
                isDragging = true;
                movedDuringDrag = false;
                pointerDownX = e.clientX;
                pointerDownY = e.clientY;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                viewport.classList.add('dragging');
            } else if (activePointers.size === 2) {
                isDragging = false;
                const pts = Array.from(activePointers.values());
                lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            }
        });

        viewport.addEventListener('pointermove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = (e.clientX - rect.left) * (canvas.width / rect.width);
            const py = (e.clientY - rect.top) * (canvas.height / rect.height);
            const hoverLL = screenToLatLon(px, py);
            document.getElementById('hover-coords').innerText = `Puntatore: ${hoverLL.lat.toFixed(2)}°, ${hoverLL.lon.toFixed(2)}°`;

            if (!activePointers.has(e.pointerId)) return;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size === 2) {
                const pts = Array.from(activePointers.values());
                const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                const midX = (pts[0].x + pts[1].x) / 2;
                const midY = (pts[0].y + pts[1].y) / 2;
                if (lastPinchDist && dist > 0) {
                    setZoomAtPoint(scale * (dist / lastPinchDist), midX, midY);
                }
                lastPinchDist = dist;
                return;
            }

            if (isDragging) {
                const dx = (e.clientX - dragStartX) * (canvas.width / rect.width);
                const dy = (e.clientY - dragStartY) * (canvas.height / rect.height);
                dragStartX = e.clientX;
                dragStartY = e.clientY;

                if (Math.hypot(e.clientX - pointerDownX, e.clientY - pointerDownY) > 6) {
                    movedDuringDrag = true;
                }

                offsetX += dx;
                offsetY += dy;
                clampPan();
                drawMap();
            }
        });

        function finishPointer(e) {
            if (activePointers.has(e.pointerId)) {
                activePointers.delete(e.pointerId);
            }
            if (activePointers.size < 2) {
                lastPinchDist = null;
            }
            if (activePointers.size === 0) {
                if (isDragging && !movedDuringDrag) {
                    handleMapTap(e.clientX, e.clientY);
                }
                isDragging = false;
                viewport.classList.remove('dragging');
            }
        }

        viewport.addEventListener('pointerup', finishPointer);
        viewport.addEventListener('pointercancel', finishPointer);

        async function searchPlace() {
            const q = document.getElementById('city-search').value.trim();
            if (!q) return;

            const localMatch = QUICK_CITIES.find(c => c.name.toLowerCase().includes(q.toLowerCase()));
            if (localMatch) {
                selectCoordinates(localMatch.lat, localMatch.lon, localMatch.name, true);
                return;
            }

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`;
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    const item = data[0];
                    const shortName = item.display_name.split(',')[0].trim();
                    selectCoordinates(parseFloat(item.lat), parseFloat(item.lon), shortName, true);
                }
            } catch (e) {
                console.warn('Ricerca località non disponibile offline', e);
            }
        }

        function useCurrentGps() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    selectCoordinates(pos.coords.latitude, pos.coords.longitude, 'Posizione attuale', true);
                },
                () => {},
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        function openInPositionClock() {
            const url = `posizione.html?lat=${selectedLat.toFixed(4)}&lon=${selectedLon.toFixed(4)}&city=${encodeURIComponent(selectedName)}`;
            window.location.href = url;
        }

        mapImg.onload = () => {
            mapLoaded = true;
            statusBanner.innerText = 'Mappa time-zones3000.gif caricata • Rotella/Pinch per zoom • Trascina';
            clampPan();
            drawMap();
        };

        mapImg.onerror = () => {
            statusBanner.innerText = 'Impossibile caricare time-zones3000.gif (controlla connessione o CORS)';
        };

        mapImg.src = MAP_IMAGE_URL;

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        updateInfoCard();
        setInterval(updateLocalClockReadout, 1000);
    </script>
</body>
</html>
