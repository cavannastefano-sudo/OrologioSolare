<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunClock24</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { 
            --bg-color: #000000; 
            color-scheme: dark;
        }
        html {
            background-color: var(--bg-color);
            transition: background-color 1s ease;
        }
        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding-bottom: env(safe-area-inset-bottom);
            color: #facc15;
            transition: background-color 1s ease;
            -webkit-user-select: none;
            user-select: none;
        }
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: min(98vw, 480px);
            margin-bottom: 8px;
            gap: 6px;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .header-bottom {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        h1 { 
            margin: 0; 
            color: #facc15; 
            font-size: 1rem; 
            white-space: nowrap;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        #digital-clock {
            font-size: 0.95rem;
            font-weight: bold;
            color: #facc15;
            background: rgba(0,0,0,0.3);
            padding: 3px 6px;
            border-radius: 6px;
            border: 1px solid rgba(0,0,0,0.4);
            letter-spacing: 0.5px;
            white-space: nowrap;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            cursor: pointer;
        }
        #digital-clock:hover {
            background: rgba(0,0,0,0.5);
        }

        #date-display-btn {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        #date-display-btn:hover {
            color: #7dd3fc;
            background: rgba(0,0,0,0.5);
        }

        #btn-now {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }
        #btn-now:hover {
            background: rgba(56, 189, 248, 0.4);
        }

        #btn-settings {
            background: rgba(0,0,0,0.3); color: #facc15; border: 1px solid rgba(0,0,0,0.5);
            padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
            white-space: nowrap;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        #btn-settings:hover { background: rgba(0,0,0,0.5); }

        #clock-wrapper {
            position: relative;
            width: min(90vw, 480px);
            height: min(90vw, 480px);
        }
        #clock-face {
            width: 100%; height: 100%; border-radius: 50%;
            background: #000; border: 4px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .hand {
            position: absolute; bottom: 50%; left: 50%;
            transform-origin: bottom center;
            border-top-left-radius: 4px; border-top-right-radius: 4px;
            z-index: 20;
        }
        
        #hand-hour { 
            width: 6px; height: 38%; 
            background: #ff5500; 
            box-shadow: 0 0 12px #ff7722, 0 0 4px #ff3300; 
            z-index: 24; 
        } 
        #hand-hour::after {
            content: "☀️";
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
        }

        #hand-minute { width: 4px; height: 42%; background: #22c55e; z-index: 22; } 
        #hand-second { width: 2px; height: 46%; background: #a855f7; z-index: 23; } 
        
        #hand-moon { 
            width: 4px; height: 40%; 
            background: #ffffff; 
            box-shadow: 0 0 12px #ffffff, 0 0 4px #e2e8f0; 
            z-index: 25; 
        }
        #hand-moon::after {
            content: "🌙";
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
        }

        #center-dot {
            position: absolute; width: 14px; height: 14px;
            background: #ff5500; border: 2px solid #fff; border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 26;
            box-shadow: 0 0 8px #ff5500;
        }

        #bottom-panels-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: min(90vw, 480px);
            margin-top: 12px;
            box-sizing: border-box;
        }

        .info-panel-box {
            flex: 1;
            min-width: 200px;
            background: rgba(0,0,0,0.25);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.78rem;
            color: #facc15;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.3);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-weight: bold;
            cursor: pointer;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            transition: background 0.2s ease;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .info-panel-box:hover {
            background: rgba(0,0,0,0.4);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-top: 6px;
            font-size: 0.75rem;
        }
        .info-grid span { 
            color: #facc15; 
            font-weight: bold; 
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1e293b; padding: 20px; border-radius: 12px;
            width: 90%; max-width: 380px; max-height: 85vh; overflow-y: auto;
            border: 1px solid #475569; box-shadow: 0 10px 25px rgba(0,0,0,0.5); box-sizing: border-box; color: #f8fafc;
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 12px;
        }
        .close-btn { background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; }
        table.times-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        table.times-table th, table.times-table td { padding: 6px 8px; border-bottom: 1px solid #334155; text-align: left; }
        table.times-table th { color: #38bdf8; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.80rem; color: #94a3b8; margin-bottom: 4px; }
        .form-group input, .form-group select {
            width: 100%; padding: 6px 8px; background: #0f172a;
            border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box;
        }
        #map-container {
            width: 100%;
            height: 250px;
            border-radius: 8px;
            margin-top: 8px;
            display: none;
            border: 1px solid #475569;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>SunClock24</h1>
            <div style="display: flex; align-items: center; gap: 6px;">
                <input type="date" id="input-date" style="display:none;" onchange="onDateChanged(this.value)">
                <button id="date-display-btn" onclick="document.getElementById('input-date').showPicker()">--/--/----</button>
                <button id="btn-settings" onclick="toggleSettingsModal(true)">⚙️</button>
            </div>
        </div>
        <div class="header-bottom">
            <input type="time" id="input-time" style="display:none;" onchange="onTimeChanged(this.value)">
            <div id="digital-clock" onclick="document.getElementById('input-time').showPicker()">00:00:00</div>
            <button id="btn-now" onclick="resetToNow()">Adesso</button>
        </div>
    </header>

    <div id="clock-wrapper">
        <div id="clock-face">
            <canvas id="clockCanvas" width="500" height="500"></canvas>
            <div class="hand" id="hand-hour"></div>
            <div class="hand" id="hand-minute"></div>
            <div class="hand" id="hand-second"></div>
            <div class="hand" id="hand-moon"></div>
            <div id="center-dot"></div>
        </div>
    </div>

    <div id="bottom-panels-container">
        <!-- Riquadro Sole in basso a sinistra -->
        <div class="info-panel-box" onclick="toggleTimesModal(true)">
            <div id="location-text">Posizione...</div>
            <div class="info-grid">
                <div>Alba:<br><span id="txt-sunrise">--:--</span></div>
                <div>Tramonto:<br><span id="txt-sunset">--:--</span></div>
                <div>Mezzogiorno:<br><span id="txt-noon">--:--</span></div>
            </div>
        </div>

        <!-- Riquadro Luna in basso a destra -->
        <div class="info-panel-box" onclick="toggleTimesModal(true)">
            <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
                <span id="moon-digital-icon" style="font-size: 1.2rem;">🌕</span>
                <span id="moon-phase-name">Caricamento...</span>
            </div>
            <div class="info-grid" style="grid-template-columns: repeat(2, 1fr); margin-top: 8px;">
                <div>Sorge:<br><span id="moon-rise">--:--</span></div>
                <div>Tramonta:<br><span id="moon-set">--:--</span></div>
            </div>
        </div>
    </div>

    <div id="modal-times" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <strong>Tutti i tempi solari e lunari</strong>
                <button class="close-btn" onclick="toggleTimesModal(false)">✕</button>
            </div>
            <table class="times-table">
                <thead><tr><th>Evento</th><th>Tempo</th></tr></thead>
                <tbody id="times-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="modal-settings" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <strong>Imposta Posizione / Fuso</strong>
                <button class="close-btn" onclick="toggleSettingsModal(false)">✕</button>
            </div>
            
            <div class="form-group">
                <label>🌍 Seleziona Fuso Orario Standard (UTC):</label>
                <select id="timezone-preset" onchange="applyTimezonePreset(this.value)">
                    <option value="">-- Seleziona Fuso Orario --</option>
                    <option value="-12">(UTC-12:00) Isola Baker</option>
                    <option value="-11">(UTC-11:00) Niue, Samoa</option>
                    <option value="-10">(UTC-10:00) Hawaii, Tahiti</option>
                    <option value="-9">(UTC-09:00) Alaska</option>
                    <option value="-8">(UTC-08:00) Pacific Time (USA / Canada)</option>
                    <option value="-7">(UTC-07:00) Mountain Time (USA / Canada)</option>
                    <option value="-6">(UTC-06:00) Central Time (USA / Canada), Città del Messico</option>
                    <option value="-5">(UTC-05:00) Eastern Time (USA / Canada), Bogotà</option>
                    <option value="-4">(UTC-04:00) Caraibi, Santiago del Cile</option>
                    <option value="-3">(UTC-03:00) Buenos Aires, Brasilia, Rio</option>
                    <option value="-2">(UTC-02:00) Isola Georgia del Sud</option>
                    <option value="-1">(UTC-01:00) Azzorre, Capo Verde</option>
                    <option value="0">(UTC+00:00) Londra, Lisbona, Accra</option>
                    <option value="1" selected>(UTC+01:00) Roma, Parigi, Berlino, Madrid</option>
                    <option value="2">(UTC+02:00) Il Cairo, Atene, Johannesburg</option>
                    <option value="3">(UTC+03:00) Mosca, Istanbul, Riyadh</option>
                    <option value="4">(UTC+04:00) Dubai, Baku</option>
                    <option value="5">(UTC+05:00) Islamabad, Tashkent</option>
                    <option value="5.5">(UTC+05:30) Nuova Deli, Mumbai</option>
                    <option value="6">(UTC+06:00) Almaty, Dacca</option>
                    <option value="7">(UTC+07:00) Bangkok, Giacarta, Ho Chi Minh</option>
                    <option value="8">(UTC+08:00) Pechino, Singapore, Perth</option>
                    <option value="9">(UTC+09:00) Tokyo, Seul</option>
                    <option value="9.5">(UTC+09:30) Darwin, Adelaide</option>
                    <option value="10">(UTC+10:00) Sydney, Melbourne, Vladivostok</option>
                    <option value="11">(UTC+11:00) Isole Salomone, Nuova Caledonia</option>
                    <option value="12">(UTC+12:00) Auckland, Figi</option>
                    <option value="13">(UTC+13:00) Samoa, Tonga</option>
                    <option value="14">(UTC+14:00) Isole Line</option>
                </select>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 8px; background: #0f172a; padding: 8px; border-radius: 6px; border: 1px solid #475569;">
                <input type="checkbox" id="chk-dst" onchange="toggleDST()" style="width: 18px; height: 18px; cursor: pointer;">
                <label for="chk-dst" style="margin: 0; color: #f8fafc; cursor: pointer; font-size: 0.85rem;">☀️ Attiva Ora Legale (+1h)</label>
            </div>

            <div class="form-group">
                <label>Cerca Località (es. Piacenza, Roma, Tokyo):</label>
                <div style="display: flex; gap: 6px;">
                    <input type="text" id="input-city" placeholder="Nome città...">
                    <button class="action-btn" onclick="searchCity()" style="padding: 6px 10px;">Cerca</button>
                </div>
                <div id="search-status" style="font-size: 0.78rem; color: #38bdf8; margin-top: 6px; line-height: 1.3;"></div>
            </div>

            <div class="form-group" style="margin-top: 8px;">
                <button class="action-btn" style="width: 100%; background: #334155; color: #38bdf8; border: 1px solid #475569;" onclick="toggleMap()">🗺️ Apri / Chiudi Mappa</button>
                <div id="map-container"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid #334155; margin: 12px 0;">

            <div class="form-group">
                <label>Latitudine:</label>
                <input type="number" step="any" id="input-lat" value="45.04">
            </div>
            <div class="form-group">
                <label>Longitudine:</label>
                <input type="number" step="any" id="input-lon" value="9.68">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 15px;">
                <button class="action-btn" style="flex:1;" onclick="applyManualLocation()">Salva</button>
                <button class="action-btn" style="flex:1; background: #334155; color: #f8fafc;" onclick="useGPSLocation()">Usa GPS</button>
            </div>
        </div>
    </div>

    <script>
        SunCalc.addTime(-18, 'astronomicalDawn', 'astronomicalDusk');
        SunCalc.addTime(-12, 'nauticalDawn', 'nauticalDusk');
        SunCalc.addTime(-6, 'dawn', 'dusk');

        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 250;
        const cy = 250;
        const radius = 248;

        const PALETTE = {
            night: '#000000', astro: '#172554', naut: '#1e3a8a',
            civil: '#3b82f6', sunriseSunset: '#f97316', golden: '#eab308', day: '#bae6fd'            
        };

        let cachedTimes = null;
        let cachedMoonTimes = null;
        let cachedMoonIllumination = null;
        let cachedLat = 45.04;
        let cachedLon = 9.68;
        let selectedDate = new Date();
        let isCustomTime = false;
        let isDstActive = false;
        let map = null;
        let marker = null;

        function initClock() {
            const savedDst = localStorage.getItem('sunclock_dst');
            if (savedDst !== null) {
                isDstActive = (savedDst === 'true');
                document.getElementById('chk-dst').checked = isDstActive;
            }

            const savedLat = localStorage.getItem('sunclock_lat');
            const savedLon = localStorage.getItem('sunclock_lon');
            if (savedLat && savedLon) {
                cachedLat = parseFloat(savedLat);
                cachedLon = parseFloat(savedLon);
                document.getElementById('input-lat').value = cachedLat;
                document.getElementById('input-lon').value = cachedLon;
                updateTimezoneSelect(cachedLon);
            }

            updateTimeForLocation();
            updateInputsVal();
            updateSunClock(cachedLat, cachedLon);
        }

        function toggleDST() {
            isDstActive = document.getElementById('chk-dst').checked;
            localStorage.setItem('sunclock_dst', isDstActive);
            if (!isCustomTime) {
                updateTimeForLocation();
            }
            updateSunClock(cachedLat, cachedLon);
        }

        function updateTimezoneSelect(lon) {
            let approxOffset = Math.round(lon / 15);
            let selectEl = document.getElementById('timezone-preset');
            for(let opt of selectEl.options) {
                if(parseFloat(opt.value) === approxOffset) {
                    selectEl.value = opt.value;
                    break;
                }
            }
        }

        function updateInputsVal() {
            const year = selectedDate.getFullYear();
            const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
            const day = String(selectedDate.getDate()).padStart(2, '0');
            const hours = String(selectedDate.getHours()).padStart(2, '0');
            const minutes = String(selectedDate.getMinutes()).padStart(2, '0');

            document.getElementById('input-date').value = `${year}-${month}-${day}`;
            document.getElementById('date-display-btn').innerText = `${day}/${month}/${year}`;
            document.getElementById('input-time').value = `${hours}:${minutes}`;
        }

        function onDateChanged(val) {
            if (!val) return;
            const parts = val.split('-');
            selectedDate = new Date(parts[0], parts[1] - 1, parts[2], selectedDate.getHours(), selectedDate.getMinutes(), selectedDate.getSeconds());
            isCustomTime = true;
            updateInputsVal();
            updateSunClock(cachedLat, cachedLon);
        }

        function onTimeChanged(val) {
            if (!val) return;
            const parts = val.split(':');
            selectedDate.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);
            isCustomTime = true;
            updateInputsVal();
            updateSunClock(cachedLat, cachedLon);
        }

        function resetToNow() {
            isCustomTime = false;
            updateTimeForLocation();
            updateInputsVal();
            updateSunClock(cachedLat, cachedLon);
        }

        function getCurrentTzOffsetHours() {
            const selectEl = document.getElementById('timezone-preset');
            let offset = selectEl.value !== "" ? parseFloat(selectEl.value) : (cachedLon / 15);
            if (isDstActive) offset += 1;
            return offset;
        }

        function updateTimeForLocation() {
            if (!isCustomTime) {
                const now = new Date();
                const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
                const tzOffsetHours = getCurrentTzOffsetHours();
                selectedDate = new Date(utc + (3600000 * tzOffsetHours));
            }
        }

        function useGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        cachedLat = position.coords.latitude;
                        cachedLon = position.coords.longitude;
                        document.getElementById('input-lat').value = cachedLat;
                        document.getElementById('input-lon').value = cachedLon;
                        localStorage.setItem('sunclock_lat', cachedLat);
                        localStorage.setItem('sunclock_lon', cachedLon);
                        
                        updateTimezoneSelect(cachedLon);
                        updateTimeForLocation();
                        updateSunClock(cachedLat, cachedLon);
                        toggleSettingsModal(false);
                    },
                    (error) => {
                        updateTimeForLocation();
                        updateSunClock(cachedLat, cachedLon); 
                        document.getElementById('location-text').innerText = "GPS disattivato. Coordinate predefinite.";
                    }
                );
            } else {
                updateTimeForLocation();
                updateSunClock(cachedLat, cachedLon);
            }
        }

        function applyTimezonePreset(val) {
            if (val === "") return;
            if (!isCustomTime) {
                updateTimeForLocation();
            }
            updateSunClock(cachedLat, cachedLon);
        }

        async function searchCity() {
            const query = document.getElementById('input-city').value.trim();
            const statusEl = document.getElementById('search-status');
            if (!query) {
                statusEl.innerText = "Inserisci il nome di una città.";
                return;
            }
            statusEl.innerText = "Ricerca in corso...";
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    cachedLat = parseFloat(data[0].lat);
                    cachedLon = parseFloat(data[0].lon);
                    document.getElementById('input-lat').value = cachedLat;
                    document.getElementById('input-lon').value = cachedLon;
                    localStorage.setItem('sunclock_lat', cachedLat);
                    localStorage.setItem('sunclock_lon', cachedLon);
                    
                    updateTimezoneSelect(cachedLon);

                    const cityName = data[0].display_name.split(',')[0];
                    statusEl.innerHTML = `<b>${cityName}</b><br>Lat: ${cachedLat.toFixed(4)}, Lon: ${cachedLon.toFixed(4)}`;
                    
                    if (map && marker) {
                        map.setView([cachedLat, cachedLon], 10);
                        marker.setLatLng([cachedLat, cachedLon]);
                    }

                    setTimeout(() => {
                        isCustomTime = false;
                        applyManualLocation();
                    }, 1200);
                } else {
                    statusEl.innerText = "Località non trovata.";
                }
            } catch (e) {
                statusEl.innerText = "Errore di connessione.";
            }
        }

        function toggleMap() {
            const mapContainer = document.getElementById('map-container');
            if (mapContainer.style.display === 'block') {
                mapContainer.style.display = 'none';
            } else {
                mapContainer.style.display = 'block';
                if (!map) {
                    const currentLat = parseFloat(document.getElementById('input-lat').value) || cachedLat;
                    const currentLon = parseFloat(document.getElementById('input-lon').value) || cachedLon;
                    
                    map = L.map('map-container').setView([currentLat, currentLon], 6);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(map);

                    marker = L.marker([currentLat, currentLon], {draggable: true}).addTo(map);

                    marker.on('dragend', function(e) {
                        const pos = marker.getLatLng();
                        document.getElementById('input-lat').value = pos.lat.toFixed(4);
                        document.getElementById('input-lon').value = pos.lng.toFixed(4);
                    });

                    map.on('click', function(e) {
                        marker.setLatLng(e.latlng);
                        document.getElementById('input-lat').value = e.latlng.lat.toFixed(4);
                        document.getElementById('input-lon').value = e.latlng.lng.toFixed(4);
                    });
                } else {
                    map.invalidateSize();
                }
            }
        }

        function applyManualLocation() {
            const lat = parseFloat(document.getElementById('input-lat').value);
            const lon = parseFloat(document.getElementById('input-lon').value);
            if (!isNaN(lat) && !isNaN(lon)) {
                cachedLat = lat; cachedLon = lon;
                localStorage.setItem('sunclock_lat', lat);
                localStorage.setItem('sunclock_lon', lon);
                updateTimezoneSelect(cachedLon);
                updateTimeForLocation();
                updateSunClock(cachedLat, cachedLon);
                toggleSettingsModal(false);
            }
        }

        function getCompleteMoonTimes(utcBaseDate, lat, lon, offsetHours) {
            let times = SunCalc.getMoonTimes(utcBaseDate, lat, lon);
            let rise = times.rise ? new Date(times.rise.getTime() + offsetHours * 3600000) : null;
            let set = times.set ? new Date(times.set.getTime() + offsetHours * 3600000) : null;
            let riseSource = "oggi";
            let setSource = "oggi";

            let dPrev = new Date(utcBaseDate);
            dPrev.setUTCDate(dPrev.getUTCDate() - 1);
            let pTimes = SunCalc.getMoonTimes(dPrev, lat, lon);
            let pRise = pTimes.rise ? new Date(pTimes.rise.getTime() + offsetHours * 3600000) : null;
            let pSet = pTimes.set ? new Date(pTimes.set.getTime() + offsetHours * 3600000) : null;

            let dNext = new Date(utcBaseDate);
            dNext.setUTCDate(dNext.getUTCDate() + 1);
            let nTimes = SunCalc.getMoonTimes(dNext, lat, lon);
            let nRise = nTimes.rise ? new Date(nTimes.rise.getTime() + offsetHours * 3600000) : null;
            let nSet = nTimes.set ? new Date(nTimes.set.getTime() + offsetHours * 3600000) : null;

            if (!rise) {
                if (times.alwaysUp) {
                    rise = "Sempre su";
                } else if (pRise && pRise > dPrev) {
                    rise = pRise;
                    riseSource = "giorno precedente";
                } else if (nRise) {
                    rise = nRise;
                    riseSource = "giorno successivo";
                }
            } else {
                riseSource = "oggi";
            }

            if (!set) {
                if (times.alwaysDown) {
                    set = "Sempre giù";
                } else if (pSet && pSet > dPrev) {
                    set = pSet;
                    setSource = "giorno precedente";
                } else if (nSet) {
                    set = nSet;
                    setSource = "giorno successivo";
                }
            } else {
                setSource = "oggi";
            }

            return { 
                rise: rise, riseSource: riseSource, 
                set: set, setSource: setSource, 
                alwaysUp: times.alwaysUp, alwaysDown: times.alwaysDown 
            };
        }

        function updateSunClock(lat, lon) {
            const tzOffsetHours = getCurrentTzOffsetHours();
            const utcBaseDate = new Date(Date.UTC(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 12, 0, 0) - (tzOffsetHours * 3600000));

            const rawTimes = SunCalc.getTimes(utcBaseDate, lat, lon);
            cachedTimes = {};
            for (let key in rawTimes) {
                if (isValidDate(rawTimes[key])) {
                    cachedTimes[key] = new Date(rawTimes[key].getTime() + (tzOffsetHours * 3600000));
                } else {
                    cachedTimes[key] = rawTimes[key];
                }
            }

            cachedMoonTimes = getCompleteMoonTimes(utcBaseDate, lat, lon, tzOffsetHours);
            cachedMoonIllumination = SunCalc.getMoonIllumination(utcBaseDate);

            updateMoonDigitalPanel(cachedMoonIllumination, cachedMoonTimes);

            ctx.clearRect(0, 0, 500, 500);

            drawSunSlicesSafe(cachedTimes);
            drawMoonVisibilityArc(cachedMoonTimes, selectedDate);
            drawSolarMeridianLines(cachedTimes);
            drawMinuteRingSafe();
            drawClockNumbers();
            updatePageBackground(cachedTimes);
            populateTable(cachedTimes, cachedMoonTimes, cachedMoonIllumination);

            document.getElementById('location-text').innerHTML = `Lat: ${lat.toFixed(2)}, Lon: ${lon.toFixed(2)}`;
            document.getElementById('txt-sunrise').innerText = formatTime(cachedTimes.sunrise);
            document.getElementById('txt-sunset').innerText = formatTime(cachedTimes.sunset);
            document.getElementById('txt-noon').innerText = formatTime(cachedTimes.solarNoon);
        }

        function timeToHours(date) {
            if (!date || !isValidDate(date)) return null;
            return date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
        }

        function hoursToAngle(h) {
            // 12 in alto, 24/00 in basso (corretto con + Math.PI / 2)
            return (h / 24) * Math.PI * 2 + Math.PI / 2;
        }

        function isValidDate(d) {
            return d instanceof Date && !isNaN(d);
        }

        function drawMoonVisibilityArc(moonTimes, refDate) {
            let rise = moonTimes.rise;
            let set = moonTimes.set;

            if (moonTimes.alwaysUp) {
                rise = new Date(refDate); rise.setHours(0,0,0,0);
                set = new Date(refDate); set.setHours(23,59,59,999);
            }

            if (!isValidDate(rise) || !isValidDate(set)) return;

            let startDayStart = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
            let startDayEnd = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate(), 23, 59, 59, 999);

            let startH, endH;

            if (rise < startDayStart) startH = 0;
            else startH = timeToHours(rise);

            if (set > startDayEnd) endH = 24;
            else endH = timeToHours(set);

            if (startH === null || endH === null) return;

            ctx.save();
            ctx.beginPath();
            let arcRadius = radius - 7;
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#64748b';

            if (endH < startH) {
                ctx.arc(cx, cy, arcRadius, hoursToAngle(startH), hoursToAngle(24));
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx, cy, arcRadius, hoursToAngle(0), hoursToAngle(endH));
                ctx.stroke();
            } else {
                ctx.arc(cx, cy, arcRadius, hoursToAngle(startH), hoursToAngle(endH));
                ctx.stroke();
            }
            ctx.restore();
        }

        function getIntervalColorSafe(h, times) {
            const hSunrise = timeToHours(times.sunrise);
            const hSunset = timeToHours(times.sunset);

            if (!isValidDate(times.sunrise) || !isValidDate(times.sunset) || hSunrise === null || hSunset === null) {
                return PALETTE.day;
            }

            const hDawn = timeToHours(times.dawn) ?? (hSunrise - 1.0);
            const hDusk = timeToHours(times.dusk) ?? (hSunset + 1.0);
            const hNautDawn = timeToHours(times.nauticalDawn) ?? (hDawn - 0.8);
            const hNautDusk = timeToHours(times.nauticalDusk) ?? (hDusk + 0.8);
            const hAstroDawn = timeToHours(times.astronomicalDawn) ?? (hNautDawn - 0.8);
            const hAstroDusk = timeToHours(times.astronomicalDusk) ?? (hNautDusk + 0.8);

            const hSunriseEndVal = timeToHours(times.sunriseEnd) ?? (hSunrise + 0.2);
            const hGoldenEndVal = timeToHours(times.goldenHourEnd) ?? (hSunrise + 1.0);
            const hGoldenStartVal = timeToHours(times.goldenHour) ?? (hSunset - 1.0);
            const hSunsetStartVal = timeToHours(times.sunsetStart) ?? (hSunset - 0.2);

            if (h >= hSunrise && h < hSunriseEndVal) return PALETTE.sunriseSunset;
            if (h >= hSunriseEndVal && h < hGoldenEndVal) return PALETTE.golden;
            if (h >= hGoldenEndVal && h < hGoldenStartVal) return PALETTE.day;
            if (h >= hGoldenStartVal && h < hSunsetStartVal) return PALETTE.golden;
            if (h >= hSunsetStartVal && h < hSunset) return PALETTE.sunriseSunset;
            if (h >= hSunset && h < hDusk) return PALETTE.civil;
            if (h >= hDawn && h < hSunrise) return PALETTE.civil;
            
            if (h >= hNautDawn && h < hDawn) return PALETTE.naut;
            if (h >= hDusk && h < hNautDusk) return PALETTE.naut;

            if (h >= hAstroDawn && h < hNautDawn) return PALETTE.astro;
            if (h >= hNautDusk && h < hAstroDusk) return PALETTE.astro;

            return PALETTE.night;
        }

        function drawSunSlicesSafe(times) {
            let hSunrise = timeToHours(times.sunrise);
            let hSunset = timeToHours(times.sunset);

            let hasValidSunset = isValidDate(times.sunrise) && isValidDate(times.sunset) && hSunrise !== null && hSunset !== null;
            
            if (!hasValidSunset) {
                for (let i = 0; i < 24; i += 0.25) {
                    drawSector(i, i + 0.25, PALETTE.day, radius);
                }
                return;
            }

            ctx.fillStyle = PALETTE.night;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            let dawnH = timeToHours(times.dawn) ?? (hSunrise - 1.0);
            let duskH = timeToHours(times.dusk) ?? (hSunset + 1.0);
            let nautDawnH = timeToHours(times.nauticalDawn) ?? (dawnH - 0.8);
            let nautDuskH = timeToHours(times.nauticalDusk) ?? (duskH + 0.8);
            let astroDawnH = timeToHours(times.astronomicalDawn) ?? (nautDawnH - 0.8);
            let astroDuskH = timeToHours(times.astronomicalDusk) ?? (nautDuskH + 0.8);

            let sunriseEndH = timeToHours(times.sunriseEnd) ?? (hSunrise + 0.2);
            let goldenEndH = timeToHours(times.goldenHourEnd) ?? (hSunrise + 1.0);
            let goldenStartH = timeToHours(times.goldenHour) ?? (hSunset - 1.0);
            let sunsetStartH = timeToHours(times.sunsetStart) ?? (hSunset - 0.2);

            drawSector(astroDawnH, nautDawnH, PALETTE.astro, radius);
            drawSector(nautDawnH, dawnH, PALETTE.naut, radius);
            drawSector(dawnH, hSunrise, PALETTE.civil, radius);
            drawSector(hSunrise, sunriseEndH, PALETTE.sunriseSunset, radius);
            drawSector(sunriseEndH, goldenEndH, PALETTE.golden, radius);
            drawSector(goldenEndH, goldenStartH, PALETTE.day, radius);
            
            drawSector(goldenStartH, sunsetStartH, PALETTE.golden, radius);
            drawSector(sunsetStartH, hSunset, PALETTE.sunriseSunset, radius);
            drawSector(hSunset, duskH, PALETTE.civil, radius);
            drawSector(duskH, nautDuskH, PALETTE.naut, radius);
            drawSector(nautDuskH, astroDuskH, PALETTE.astro, radius);
        }

        function drawSector(startH, endH, color, r) {
            if (startH === null || endH === null || isNaN(startH) || isNaN(endH)) return;
            startH = (startH + 24) % 24;
            endH = (endH + 24) % 24;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            if (endH < startH) {
                ctx.arc(cx, cy, r, hoursToAngle(startH), hoursToAngle(24));
                ctx.arc(cx, cy, r, hoursToAngle(0), hoursToAngle(endH));
            } else {
                ctx.arc(cx, cy, r, hoursToAngle(startH), hoursToAngle(endH));
            }
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawSolarMeridianLines(times) {
            if (isValidDate(times.solarNoon)) {
                const noonHours = timeToHours(times.solarNoon);
                if (noonHours !== null) {
                    const noonAngle = hoursToAngle(noonHours);
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + radius * Math.cos(noonAngle), cy + radius * Math.sin(noonAngle));
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }

            if (isValidDate(times.nadir)) {
                const nadirHours = timeToHours(times.nadir);
                if (nadirHours !== null) {
                    const nadirAngle = hoursToAngle(nadirHours);
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + radius * Math.cos(nadirAngle), cy + radius * Math.sin(nadirAngle));
                    ctx.strokeStyle = '#ef4444';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            }
        }

        function drawMinuteRingSafe() {
            for (let i = 0; i < 60; i++) {
                const angle = (i / 60) * Math.PI * 2 + Math.PI / 2;
                const len = (i % 5 === 0) ? 18 : 10;

                const x1 = cx + (radius - len) * Math.cos(angle);
                const y1 = cy + (radius - len) * Math.sin(angle);
                const x2 = cx + radius * Math.cos(angle);
                const y2 = cy + radius * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = (i % 5 === 0) ? 4.5 : 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = (i % 5 === 0) ? 2 : 1.2;
                ctx.stroke();
            }
        }

        function drawClockNumbers() {
            ctx.font = 'bold 20px sans-serif';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';

            const hRadius = radius * 0.68;
            for (let i = 1; i <= 24; i++) {
                const angleRad = hoursToAngle(i);
                const hx = cx + hRadius * Math.cos(angleRad);
                const hy = cy + hRadius * Math.sin(angleRad);

                ctx.lineWidth = 4;
                ctx.strokeStyle = '#000000';
                ctx.strokeText(i, hx, hy);

                ctx.fillStyle = '#facc15';
                ctx.fillText(i, hx, hy);
            }

            ctx.font = 'bold 20px sans-serif';
            const mRadius = radius * 0.85;
            for (let m = 0; m < 60; m += 5) {
                const angleRad = (m / 60) * Math.PI * 2 + Math.PI / 2;
                const mx = cx + mRadius * Math.cos(angleRad);
                const my = cy + mRadius * Math.sin(angleRad);

                const minText = String(m).padStart(2, '0');

                ctx.lineWidth = 4;
                ctx.strokeStyle = '#000000';
                ctx.strokeText(minText, mx, my);

                ctx.fillStyle = '#facc15';
                ctx.fillText(minText, mx, my);
            }
        }

        function updatePageBackground(times) {
            if (!times) return;
            const h = timeToHours(selectedDate);
            const currentColor = getIntervalColorSafe(h, times);
            const finalBg = currentColor === PALETTE.night ? '#000000' : currentColor;
            
            document.documentElement.style.backgroundColor = finalBg;
            document.body.style.backgroundColor = finalBg;
            
            const isDark = (finalBg === '#000000' || finalBg === '#172554' || finalBg === '#1e3a8a');
            document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
            
            let metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
                metaThemeColor.setAttribute('content', finalBg);
            }
        }

        function formatTime(date) {
            if (!isValidDate(date)) return "--:--";
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        function updateMoonDigitalPanel(illumination, moonTimes) {
            const iconEl = document.getElementById('moon-digital-icon');
            const phaseNameEl = document.getElementById('moon-phase-name');
            const riseEl = document.getElementById('moon-rise');
            const setEl = document.getElementById('moon-set');
            const phase = illumination.phase;

            let phaseName = "";
            let iconSymbol = "🌕";

            if (phase < 0.03 || phase > 0.97) { iconSymbol = "🌑"; phaseName = "Luna Nuova"; }
            else if (phase < 0.22) { iconSymbol = "🌒"; phaseName = "Crescente"; }
            else if (phase < 0.28) { iconSymbol = "🌓"; phaseName = "Primo Quarto"; }
            else if (phase < 0.47) { iconSymbol = "🌔"; phaseName = "Gibbosa Crescente"; }
            else if (phase < 0.53) { iconSymbol = "🌕"; phaseName = "Luna Piena"; }
            else if (phase < 0.72) { iconSymbol = "🌖"; phaseName = "Gibbosa Calante"; }
            else if (phase < 0.78) { iconSymbol = "🌗"; phaseName = "Ultimo Quarto"; }
            else { iconSymbol = "🌘"; phaseName = "Calante"; }

            iconEl.innerText = iconSymbol;
            phaseNameEl.innerText = phaseName;
            
            if (isValidDate(moonTimes.rise)) {
                let suffix = moonTimes.riseSource !== "oggi" ? ` (${moonTimes.riseSource})` : " (oggi)";
                riseEl.innerHTML = formatTime(moonTimes.rise) + `<br><span style="font-size:0.6rem; opacity:0.8;">${suffix}</span>`;
            } else {
                riseEl.innerText = moonTimes.rise || "--:--";
            }

            if (isValidDate(moonTimes.set)) {
                let suffix = moonTimes.setSource !== "oggi" ? ` (${moonTimes.setSource})` : " (oggi)";
                setEl.innerHTML = formatTime(moonTimes.set) + `<br><span style="font-size:0.6rem; opacity:0.8;">${suffix}</span>`;
            } else {
                setEl.innerText = moonTimes.set || "--:--";
            }
        }

        function populateTable(times, moonTimes, illumination) {
            const tbody = document.getElementById('times-table-body');
            const phasePct = Math.round(illumination.fraction * 100);
            
            let riseStr = isValidDate(moonTimes.rise) ? formatTime(moonTimes.rise) + (moonTimes.riseSource !== "oggi" ? ` (${moonTimes.riseSource})` : " (oggi)") : moonTimes.rise;
            let setStr = isValidDate(moonTimes.set) ? formatTime(moonTimes.set) + (moonTimes.setSource !== "oggi" ? ` (${moonTimes.setSource})` : " (oggi)") : moonTimes.set;

            tbody.innerHTML = `
                <tr style="background: rgba(56, 189, 248, 0.1);"><td colspan="2"><b>🌙 Dati Lunari</b></td></tr>
                <tr><td>Fase Lunare</td><td>${phasePct}% illuminata</td></tr>
                <tr><td>Sorge la Luna</td><td>${riseStr}</td></tr>
                <tr><td>Tramonta la Luna</td><td>${setStr}</td></tr>
                
                <tr style="background: rgba(250, 204, 21, 0.1);"><td colspan="2"><b>☀️ Dati Solari e Crepuscoli</b></td></tr>
                <tr><td>Mezzanotte solare</td><td>${formatTime(times.nadir)}</td></tr>
                <tr><td>Alba astronomica</td><td>${formatTime(times.astronomicalDawn)}</td></tr>
                <tr><td>Alba Nautica</td><td>${formatTime(times.nauticalDawn)}</td></tr>
                <tr><td>Alba Civile</td><td>${formatTime(times.dawn)}</td></tr>
                <tr><td>Alba</td><td>${formatTime(times.sunrise)}</td></tr>
                <tr><td>Fine dell'alba</td><td>${formatTime(times.sunriseEnd)}</td></tr>
                <tr><td>Fine dell'ora d'oro</td><td>${formatTime(times.goldenHourEnd)}</td></tr>
                <tr><td>Mezzogiorno solare</td><td>${formatTime(times.solarNoon)}</td></tr>
                <tr><td>Inizio dell'ora d'oro</td><td>${formatTime(times.goldenHour)}</td></tr>
                <tr><td>Inizio del tramonto</td><td>${formatTime(times.sunsetStart)}</td></tr>
                <tr><td>Tramonto</td><td>${formatTime(times.sunset)}</td></tr>
                <tr><td>Crepuscolo civile</td><td>${formatTime(times.dusk)}</td></tr>
                <tr><td>Crepuscolo nautico</td><td>${formatTime(times.nauticalDusk)}</td></tr>
                <tr><td>Crepuscolo astronomico</td><td>${formatTime(times.astronomicalDusk)}</td></tr>
            `;
        }

        function toggleTimesModal(show) {
            document.getElementById('modal-times').style.display = show ? 'flex' : 'none';
        }

        function toggleSettingsModal(show) {
            document.getElementById('modal-settings').style.display = show ? 'flex' : 'none';
        }

        function updateHands() {
            if (!isCustomTime) {
                updateTimeForLocation();
                updateInputsVal();
            }
            
            document.getElementById('digital-clock').innerText = selectedDate.toLocaleTimeString();

            const h = selectedDate.getHours() + selectedDate.getMinutes() / 60 + selectedDate.getSeconds() / 3600;
            const m = selectedDate.getMinutes() + selectedDate.getSeconds() / 60;
            const s = selectedDate.getSeconds() + selectedDate.getMilliseconds() / 1000;

            const hourDeg = (h / 24) * 360 - 180;
            document.getElementById('hand-hour').style.transform = `rotate(${hourDeg}deg)`;

            const minuteDeg = (m / 60) * 360;
            document.getElementById('hand-minute').style.transform = `rotate(${minuteDeg}deg)`;

            const secDeg = (s / 60) * 360;
            document.getElementById('hand-second').style.transform = `rotate(${secDeg}deg)`;

            if (cachedMoonTimes && (isValidDate(cachedMoonTimes.rise) || isValidDate(cachedMoonTimes.set) || cachedMoonTimes.alwaysUp)) {
                let rise = cachedMoonTimes.rise;
                let set = cachedMoonTimes.set;

                if (cachedMoonTimes.alwaysUp) {
                    rise = new Date(selectedDate); rise.setHours(0,0,0,0);
                    set = new Date(selectedDate); set.setHours(23,59,59,999);
                }

                let startDayStart = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate());
                let startDayEnd = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 23, 59, 59, 999);

                let moonRiseH = isValidDate(rise) ? (rise < startDayStart ? 0 : timeToHours(rise)) : 0;
                let moonSetH = isValidDate(set) ? (set > startDayEnd ? 24 : timeToHours(set)) : 24;

                const currentH = h;
                let moonDeg = 0;
                
                if (moonRiseH < moonSetH) {
                    if (currentH >= moonRiseH && currentH <= moonSetH) {
                        let progress = (currentH - moonRiseH) / (moonSetH - moonRiseH);
                        moonDeg = (progress * 24) / 24 * 360 - 180;
                    } else {
                        let offProgress = currentH > moonSetH ? (currentH - moonSetH) / (24 - moonSetH + moonRiseH) : (currentH + (24 - moonSetH)) / (24 - moonSetH + moonRiseH);
                        moonDeg = (offProgress * 24) / 24 * 360 - 180;
                    }
                } else {
                    if (currentH >= moonRiseH || currentH <= moonSetH) {
                        let totalVisible = (24 - moonRiseH) + moonSetH;
                        let elapsed = currentH >= moonRiseH ? (currentH - moonRiseH) : (24 - moonRiseH + currentH);
                        let progress = elapsed / totalVisible;
                        moonDeg = (progress * 24) / 24 * 360 - 180;
                    } else {
                        let totalHidden = moonRiseH - moonSetH;
                        let elapsed = currentH - moonSetH;
                        let progress = elapsed / totalHidden;
                        moonDeg = (progress * 24) / 24 * 360 - 180;
                    }
                }
                document.getElementById('hand-moon').style.transform = `rotate(${moonDeg}deg)`;
            } else {
                const fallbackMoonDeg = ((h * 0.965) / 24) * 360 - 180;
                document.getElementById('hand-moon').style.transform = `rotate(${fallbackMoonDeg}deg)`;
            }

            if (cachedTimes) {
                updatePageBackground(cachedTimes);
            }
        }

        initClock();
        setInterval(updateHands, 50);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.service.worker.js');
        }
    </script>
