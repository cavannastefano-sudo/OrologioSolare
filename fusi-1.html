<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SunClock24 - Mappa Fusi Orari</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="icon" type="image/jpeg" href="IMG_20260808_102945.jpg">

    <!-- Leaflet per la mappa geografica sotto -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Libreria fuso orario da coordinate -->
    <script src="https://unpkg.com/tz-lookup@6.1.25/tz.js"></script>
    <script src="timezone-manager.js"></script>

    <style>
        :root {
            --bg-main: #020617;
            --panel-bg: rgba(15, 23, 42, 0.94);
            --border-color: #334155;
            --accent-cyan: #38bdf8;
            --accent-green: #39ff14;
            --accent-yellow: #facc15;
            --accent-pink: #ff007f;
            --android-top-inset: 0px;
            --android-bottom-inset: 0px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg-main);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-y: auto;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            min-height: 100dvh;
            padding-top: calc(8px + env(safe-area-inset-top, 0px) + var(--android-top-inset));
            padding-right: calc(4px + env(safe-area-inset-right, 0px));
            padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px) + var(--android-bottom-inset));
            padding-left: calc(4px + env(safe-area-inset-left, 0px));
            gap: 4px;
        }

        .top-bar,
        .search-row,
        .info-card {
            width: 100%;
            max-width: 1400px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: wrap;
            z-index: 20;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav {
            background: #0f172a;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }

        .btn-nav:hover {
            background: #0284c7;
            color: #ffffff;
            border-color: #e0f2fe;
        }

        .page-title {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--accent-yellow);
            letter-spacing: 0.3px;
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .map-switcher {
            display: inline-flex;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }

        .btn-map-switch {
            background: transparent;
            color: #cbd5e1;
            border: none;
            border-radius: 6px;
            padding: 3px 7px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-map-switch.active {
            background: #0284c7;
            color: #ffffff;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2px 5px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
        }

        .btn-zoom {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 5px;
            min-width: 26px;
            height: 24px;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
        }

        .btn-zoom:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .zoom-readout {
            min-width: 44px;
            text-align: center;
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--accent-green);
        }

        .search-row {
            display: flex;
            gap: 5px;
            z-index: 20;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 7px;
            padding: 5px 8px;
            font-size: 0.82rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
        }

        .btn-search {
            background: #2563eb;
            color: #ffffff;
            border: 1px solid #93c5fd;
            border-radius: 7px;
            padding: 0 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-search:hover {
            background: #1d4ed8;
        }

        .map-viewport {
            position: relative;
            flex: 1 1 auto;
            width: 100%;
            max-width: 1400px;
            min-height: 60dvh;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            background: #030712;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
        }

        @media (min-aspect-ratio: 16/10) and (min-width: 760px) {
            .map-viewport {
                flex: 0 1 auto;
                aspect-ratio: 2 / 1;
                min-height: 460px;
            }
        }

        #map-underlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #map-overlay-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Immagine sopra ben dimensionata e senza allungamento */
        #overlay-map-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0.78;
            transform-origin: center center;
            transition: transform 0.12s ease-out;
        }

        .map-status-banner {
            position: absolute;
            top: 6px;
            left: 6px;
            right: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: rgba(2, 6, 23, 0.82);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #e2e8f0;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 3px 7px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
        }

        .crosshair-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(2, 6, 23, 0.86);
            border: 1px solid rgba(56, 189, 248, 0.45);
            color: #e2e8f0;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 10;
        }

        .info-card {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 20;
            box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.65);
        }

        .info-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: wrap;
        }

        .place-title {
            font-size: 0.88rem;
            font-weight: 800;
            color: var(--accent-yellow);
        }

        .tz-pill {
            background: rgba(56, 189, 248, 0.14);
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 999px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            font-size: 0.74rem;
        }

        .info-box {
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 3px 6px;
        }

        .info-box small {
            display: block;
            color: #94a3b8;
            font-size: 0.65rem;
            font-weight: 700;
        }

        .info-box strong {
            color: var(--accent-green);
            font-size: 0.8rem;
        }

        .actions-row {
            display: flex;
            gap: 5px;
        }

        .btn-primary-open {
            flex: 1;
            background: #16a34a;
            color: #ffffff;
            border: 1px solid #86efac;
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-primary-open:hover {
            background: #15803d;
        }

        .btn-gps {
            background: #0f172a;
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
            border-radius: 7px;
            padding: 6px 9px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-gps:hover {
            background: rgba(250, 204, 21, 0.14);
        }
    </style>
</head>
<body>
    <div id="app-shell" class="app-shell">
        <div class="top-bar">
            <div class="nav-group">
                <a href="index.html" class="btn-nav">🏠 Home</a>
                <span class="page-title">🌍 Fusi Orari</span>
            </div>

            <div class="right-controls">
                <div class="map-switcher" role="group" aria-label="Selettore mappa">
                    <button type="button" id="btn-map-tz" class="btn-map-switch active" onclick="switchMapSource('time-zones3000.gif')">Fusi GIF</button>
                    <button type="button" id="btn-map-world" class="btn-map-switch" onclick="switchMapSource('carte-du-monde.jpg')">Mondo JPG</button>
                    <button type="button" id="btn-map-none" class="btn-map-switch" onclick="switchMapSource('')">Solo Mappa</button>
                </div>

                <div class="zoom-controls">
                    <button type="button" class="btn-zoom" onclick="zoomBy(1 / 1.35)" title="Zoom indietro">−</button>
                    <span id="zoom-readout" class="zoom-readout">100%</span>
                    <button type="button" class="btn-zoom" onclick="zoomBy(1.35)" title="Zoom avanti">+</button>
                    <button type="button" class="btn-zoom" onclick="resetZoom()" title="Ripristina vista">1:1</button>
                </div>
            </div>
        </div>

        <div class="search-row">
            <input type="text" id="city-search" class="search-input" placeholder="Cerca località (es. Piacenza, Tokyo, New York, Londra)..." onkeydown="if (event.key === 'Enter') searchPlace();">
            <button type="button" class="btn-search" onclick="searchPlace()">Cerca</button>
        </div>

        <div id="map-viewport" class="map-viewport">
            <div class="map-status-banner">
                <span id="map-status-text">Clicca sulla mappa per luogo • Mappa sotto + immagine sopra ben dimensionata</span>
            </div>

            <!-- Mappa geografica reale sotto -->
            <div id="map-underlay"></div>

            <!-- Immagine sopra ben dimensionata senza allungamento -->
            <div id="map-overlay-layer">
                <img id="overlay-map-img" src="time-zones3000.gif" alt="Mappa sovrapposta">
            </div>

            <div id="hover-coords" class="crosshair-badge">Puntatore: --.--°, --.--°</div>
        </div>

        <div id="info-card" class="info-card">
            <div class="info-top">
                <div id="selected-place-name" class="place-title">Italia - Piacenza</div>
                <div id="selected-tz-badge" class="tz-pill">UTC+1 • Europe/Rome</div>
            </div>

            <div class="info-grid">
                <div class="info-box">
                    <small>Coordinate</small>
                    <strong id="selected-coords">45.05°N, 9.69°E</strong>
                </div>
                <div class="info-box">
                    <small>Ora locale stimata</small>
                    <strong id="selected-local-time">--:--:--</strong>
                </div>
                <div class="info-box">
                    <small>Offset attuale</small>
                    <strong id="selected-offset">UTC +1</strong>
                </div>
            </div>

            <div class="actions-row">
                <button type="button" class="btn-gps" onclick="useCurrentGps()">📍 Mia posizione</button>
                <button type="button" class="btn-primary-open" onclick="openInPositionClock()">☀️ Apri in Orologio Posizione</button>
            </div>
        </div>
    </div>

    <script>
        function syncNavigationBarSafeArea() {
            const shell = document.getElementById('app-shell');
            const infoCard = document.getElementById('info-card');
            let topPx = 0;
            let bottomPx = 0;

            try {
                if (window.AndroidInterface) {
                    if (typeof window.AndroidInterface.getTopInsetPx === 'function') {
                        const tVal = parseInt(window.AndroidInterface.getTopInsetPx(), 10);
                        if (!Number.isNaN(tVal) && tVal > 0) topPx = tVal;
                    }
                    if (typeof window.AndroidInterface.getBottomInsetPx === 'function') {
                        const bVal = parseInt(window.AndroidInterface.getBottomInsetPx(), 10);
                        if (!Number.isNaN(bVal) && bVal > 0) bottomPx = bVal;
                    }
                }
            } catch (e) {}

            if (shell) {
                const topPad = topPx > 0 ? Math.ceil(topPx * 0.35) + 8 : 8;
                const bottomPad = bottomPx > 0 ? Math.ceil(bottomPx * 0.35) + 8 : 8;
                shell.style.paddingTop = `calc(${topPad}px + env(safe-area-inset-top, 0px))`;
                shell.style.paddingBottom = `calc(${bottomPad}px + env(safe-area-inset-bottom, 0px))`;
            }

            if (infoCard && bottomPx > 0) {
                const safeMargin = Math.min(80, Math.max(12, Math.round(bottomPx * 0.25)));
                infoCard.style.marginBottom = `${safeMargin}px`;
            }

            if (typeof map !== 'undefined') {
                map.invalidateSize();
            }
        }

        const params = new URLSearchParams(window.location.search);
        let selectedLat = params.get('lat') ? parseFloat(params.get('lat')) : 45.0526;
        let selectedLon = params.get('lon') ? parseFloat(params.get('lon')) : 9.6930;
        let selectedName = params.get('city') ? decodeURIComponent(params.get('city')) : 'Italia - Piacenza';
        let selectedTz = 'Europe/Rome';
        let selectedOffsetHours = 1;
        let reverseLookupSeq = 0;

        // Mappa geografica reale sotto
        const chiara = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        });

        const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; OpenStreetMap contributors | Map style: &copy; OpenTopoMap'
        });

        const savedLayerName = localStorage.getItem('sunclock_map_layer');
        const initialLayer = (savedLayerName === 'Mappa Chiara') ? chiara : topo;

        const map = L.map('map-underlay', {
            center: [selectedLat, selectedLon],
            zoom: 3,
            layers: [initialLayer]
        });

        let selectedMarker = L.circleMarker([selectedLat, selectedLon], {
            radius: 7,
            color: '#ffffff',
            weight: 2,
            fillColor: '#ff007f',
            fillOpacity: 1
        }).addTo(map);

        const overlayImg = document.getElementById('overlay-map-img');
        let overlayZoomFactor = 1.0;

        function updateZoomReadout() {
            const pct = Math.round((map.getZoom() / 3) * 100 * overlayZoomFactor);
            document.getElementById('zoom-readout').innerText = `${pct}%`;
            if (overlayImg) {
                overlayImg.style.transform = `scale(${overlayZoomFactor})`;
            }
        }

        function zoomBy(factor) {
            overlayZoomFactor = Math.max(0.7, Math.min(2.5, overlayZoomFactor * factor));
            if (factor > 1) {
                map.zoomIn();
            } else {
                map.zoomOut();
            }
            updateZoomReadout();
        }

        function resetZoom() {
            overlayZoomFactor = 1.0;
            map.setView([selectedLat, selectedLon], 3);
            updateZoomReadout();
        }

        function switchMapSource(fileName) {
            document.getElementById('btn-map-tz').classList.toggle('active', fileName === 'time-zones3000.gif');
            document.getElementById('btn-map-world').classList.toggle('active', fileName === 'carte-du-monde.jpg');
            document.getElementById('btn-map-none').classList.toggle('active', fileName === '');

            if (!fileName) {
                overlayImg.style.display = 'none';
                document.getElementById('map-status-text').innerText = 'Solo mappa geografica sotto • Clicca una località';
                return;
            }

            overlayImg.style.display = 'block';
            overlayImg.src = fileName;
            document.getElementById('map-status-text').innerText = `${fileName} sopra (proporzioni mantenute) + mappa sotto`;
        }

        function formatCoordLabel(lat, lon) {
            const latDir = lat >= 0 ? 'N' : 'S';
            const lonDir = lon >= 0 ? 'E' : 'W';
            return `${Math.abs(lat).toFixed(2)}°${latDir}, ${Math.abs(lon).toFixed(2)}°${lonDir}`;
        }

        function getPreciseStandardTimezone(lat, lon) {
            if (lat >= 65.4 && lat <= 66.2 && lon >= -169.5 && lon <= -168.3) {
                return (lon < -168.9) ? 12 : -9;
            }
            if (lat >= 36.9 && lat <= 42.2 && lon >= -9.5 && lon <= -6.0) return 0;
            if (lat >= 51.4 && lat <= 55.5 && lon >= -10.7 && lon <= -5.3) return 0;
            if (lat >= 36.0 && lat <= 43.8 && lon >= -9.3 && lon <= 3.4) return 1;
            if (lat >= 42.3 && lat <= 51.1 && lon >= -5.1 && lon <= 8.3) return 1;

            try {
                if (typeof tzlookup === 'function') {
                    const tzString = tzlookup(lat, lon);
                    const janDate = new Date(new Date().getFullYear(), 0, 15);
                    const parts = new Intl.DateTimeFormat('en-US', {
                        timeZone: tzString,
                        timeZoneName: 'shortOffset'
                    }).formatToParts(janDate);
                    const offsetPart = parts.find(p => p.type === 'timeZoneName');
                    if (offsetPart) {
                        const match = offsetPart.value.match(/GMT([+-]\d+)(?::(\d+))?/);
                        if (match) {
                            const hours = parseInt(match[1], 10);
                            const minutes = match[2] ? parseInt(match[2], 10) / 60 : 0;
                            return hours + (hours < 0 ? -minutes : minutes);
                        }
                    }
                }
            } catch (e) {}

            return Math.round(lon / 15);
        }

        function getCurrentDstStateForCoords(lat, lon, date) {
            const isAuto = localStorage.getItem('sunclock_auto_dst') !== 'false';
            if (isAuto && !isNaN(lat) && !isNaN(lon)) {
                try {
                    if (typeof tzlookup === 'function') {
                        const tzString = tzlookup(lat, lon);
                        if (tzString.startsWith('Africa/')) return false;
                        const parts = new Intl.DateTimeFormat('en-US', {
                            timeZone: tzString,
                            timeZoneName: 'shortOffset'
                        }).formatToParts(date);
                        const offsetPart = parts.find(p => p.type === 'timeZoneName');
                        if (offsetPart) {
                            const match = offsetPart.value.match(/GMT([+-]\d+)(?::(\d+))?/);
                            if (match) {
                                const currentOffset = parseInt(match[1], 10);
                                const standardBaseOffset = getPreciseStandardTimezone(lat, lon);
                                return currentOffset > standardBaseOffset;
                            }
                        }
                    }
                } catch (e) {}
            }
            return localStorage.getItem('sunclock_dst') === 'true';
        }

        function isDstActiveForCoords(lat, lon) {
            return getCurrentDstStateForCoords(lat, lon, new Date());
        }

        async function resolveExactPlaceName(lat, lon, tzName) {
            const seq = ++reverseLookupSeq;
            try {
                const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=10&accept-language=it`;
                const res = await fetch(url);
                if (!res.ok) return;
                const geoData = await res.json();
                if (seq !== reverseLookupSeq) return;

                let country = '';
                let specificLocality = '';
                if (geoData && geoData.address) {
                    country = geoData.address.country || '';
                    specificLocality = geoData.address.city ||
                                       geoData.address.town ||
                                       geoData.address.village ||
                                       geoData.address.municipality ||
                                       geoData.address.county ||
                                       geoData.address.state || '';
                }

                let fullName = '';
                if (country && specificLocality && specificLocality.toLowerCase() !== country.toLowerCase()) {
                    fullName = `${country} - ${specificLocality}`;
                } else {
                    fullName = specificLocality || country || '';
                }

                if (!fullName && tzName && tzName.includes('/')) {
                    const region = tzName.split('/').pop().replace(/_/g, ' ');
                    if (region && region !== 'UTC') fullName = region;
                }

                if (fullName) {
                    selectedName = fullName;
                    document.getElementById('selected-place-name').innerText = selectedName;
                }
            } catch (e) {}
        }

        function resolveTimezoneInfo(lat, lon) {
            let tzName = 'UTC';
            if (lat >= 65.4 && lat <= 66.2 && lon >= -169.5 && lon <= -168.3) {
                tzName = (lon < -168.9) ? 'Asia/Anadyr' : 'America/Nome';
            } else {
                try {
                    if (typeof tzlookup === 'function') {
                        tzName = tzlookup(lat, lon) || 'UTC';
                    }
                } catch (e) {
                    tzName = 'UTC';
                }
            }

            let offsetHours = getPreciseStandardTimezone(lat, lon);
            try {
                const now = new Date();
                const parts = new Intl.DateTimeFormat('en-US', {
                    timeZone: tzName,
                    timeZoneName: 'shortOffset'
                }).formatToParts(now);
                const tzPart = parts.find(p => p.type === 'timeZoneName');
                if (tzPart) {
                    const m = tzPart.value.match(/GMT([+-]\d+)(?::(\d+))?/);
                    if (m) {
                        const h = parseInt(m[1], 10);
                        const min = m[2] ? parseInt(m[2], 10) / 60 : 0;
                        offsetHours = h + (h < 0 ? -min : min);
                    }
                }
            } catch (e) {}

            return { tzName, offsetHours };
        }

        function formatOffset(offsetHours) {
            const sign = offsetHours >= 0 ? '+' : '-';
            const abs = Math.abs(offsetHours);
            const h = Math.floor(abs);
            const m = Math.round((abs - h) * 60);
            return m > 0 ? `UTC ${sign}${h}:${String(m).padStart(2, '0')}` : `UTC ${sign}${h}`;
        }

        function updateLocalClockReadout() {
            const now = new Date();
            try {
                const formatter = new Intl.DateTimeFormat('it-IT', {
                    timeZone: selectedTz,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
                const parts = formatter.formatToParts(now);
                const obj = {};
                parts.forEach(p => { obj[p.type] = p.value; });
                if (obj.hour && obj.minute && obj.second) {
                    document.getElementById('selected-local-time').innerText = `${obj.hour}:${obj.minute}:${obj.second}`;
                    return;
                }
            } catch (e) {}

            const target = new Date(now.getTime() + selectedOffsetHours * 3600000);
            const hh = String(target.getUTCHours()).padStart(2, '0');
            const mm = String(target.getUTCMinutes()).padStart(2, '0');
            const ss = String(target.getUTCSeconds()).padStart(2, '0');
            document.getElementById('selected-local-time').innerText = `${hh}:${mm}:${ss}`;
        }

        function updateInfoCard(lookupExactPlace = false) {
            const info = resolveTimezoneInfo(selectedLat, selectedLon);
            selectedTz = info.tzName;
            selectedOffsetHours = info.offsetHours;

            document.getElementById('selected-place-name').innerText = selectedName;
            document.getElementById('selected-tz-badge').innerText = `${formatOffset(selectedOffsetHours).replace(' ', '')} • ${selectedTz}`;
            document.getElementById('selected-coords').innerText = formatCoordLabel(selectedLat, selectedLon);
            document.getElementById('selected-offset').innerText = formatOffset(selectedOffsetHours);
            updateLocalClockReadout();

            if (selectedMarker) {
                selectedMarker.setLatLng([selectedLat, selectedLon]);
            }

            if (lookupExactPlace) {
                resolveExactPlaceName(selectedLat, selectedLon, selectedTz);
            }
        }

        function selectCoordinates(lat, lon, name, centerView = false, lookupExactPlace = false) {
            selectedLat = Math.max(-85, Math.min(85, lat));
            selectedLon = Math.max(-180, Math.min(180, lon));
            selectedName = name || formatCoordLabel(selectedLat, selectedLon);

            if (centerView) {
                map.setView([selectedLat, selectedLon], Math.max(map.getZoom(), 6));
            }

            updateInfoCard(lookupExactPlace);
        }

        map.on('mousemove', (e) => {
            document.getElementById('hover-coords').innerText = `Puntatore: ${e.latlng.lat.toFixed(2)}°, ${e.latlng.lng.toFixed(2)}°`;
        });

        map.on('zoomend', updateZoomReadout);

        map.on('click', (e) => {
            selectCoordinates(e.latlng.lat, e.latlng.lng, formatCoordLabel(e.latlng.lat, e.latlng.lng), false, true);
        });

        async function searchPlace() {
            const q = document.getElementById('city-search').value.trim();
            if (!q) return;

            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=it&q=${encodeURIComponent(q)}`;
                const res = await fetch(url);
                const data = await res.json();
                if (Array.isArray(data) && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    selectCoordinates(lat, lon, formatCoordLabel(lat, lon), true, true);
                }
            } catch (e) {
                console.warn('Ricerca località non disponibile offline', e);
            }
        }

        function useCurrentGps() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    selectCoordinates(pos.coords.latitude, pos.coords.longitude, formatCoordLabel(pos.coords.latitude, pos.coords.longitude), true, true);
                },
                () => {},
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        function openInPositionClock() {
            const activeDst = isDstActiveForCoords(selectedLat, selectedLon);
            const isAuto = localStorage.getItem('sunclock_auto_dst') !== 'false';
            const url = `posizione.html?lat=${selectedLat}&lon=${selectedLon}&city=${encodeURIComponent(selectedName)}&auto=${isAuto}&dst=${activeDst}`;
            window.location.href = url;
        }

        window.addEventListener('resize', syncNavigationBarSafeArea);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncNavigationBarSafeArea);
        }
        syncNavigationBarSafeArea();
        updateZoomReadout();
        updateInfoCard(!params.get('city'));
        setInterval(updateLocalClockReadout, 1000);
        setInterval(syncNavigationBarSafeArea, 1500);
    </script>
</body>
</html>
