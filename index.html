<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunclock 24H App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- Libreria Astronomy Engine -->
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    
    <!-- Foglio di stile -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Sunclock 24H</h1>
        <button id="btn-settings" onclick="toggleSettingsModal(true)">⚙️ Posizione</button>
    </header>

    <div id="clock-wrapper">
        <div id="clock-face">
            <canvas id="clockCanvas" width="500" height="500"></canvas>
            <div id="clock-elements-container"></div>
            <div class="hand" id="hand-hour"></div>
            <div class="hand" id="hand-minute"></div>
            <div class="hand" id="hand-second"></div>
            <div class="hand" id="hand-utc"></div>
            <div id="center-dot"></div>
        </div>
    </div>

    <div id="info-panel">
        <div id="location-text">Rilevamento posizione in corso...</div>
        <div class="info-grid">
            <div>Alba: <span id="txt-sunrise">--:--</span></div>
            <div>Tramonto: <span id="txt-sunset">--:--</span></div>
            <div>Mezzogiorno: <span id="txt-noon">--:--</span></div>
            <div>Mezzanotte S.: <span id="txt-midnight">--:--</span></div>
        </div>
        <div class="panel-buttons">
            <button class="action-btn" onclick="toggleTimesModal(true)">Tutti i tempi</button>
        </div>
    </div>

    <!-- Modale Tempi -->
    <div id="modal-times" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <strong>Tutti i tempi solari</strong>
                <button class="close-btn" onclick="toggleTimesModal(false)">✕</button>
            </div>
            <table class="times-table">
                <thead><tr><th>Evento</th><th>Tempo</th></tr></thead>
                <tbody id="times-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Modale Impostazioni -->
    <div id="modal-settings" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <strong>Imposta Posizione</strong>
                <button class="close-btn" onclick="toggleSettingsModal(false)">✕</button>
            </div>
            <div class="form-group">
                <label>Latitudine:</label>
                <input type="number" step="any" id="input-lat" value="45.04">
            </div>
            <div class="form-group">
                <label>Longitudine:</label>
                <input type="number" step="any" id="input-lon" value="9.68">
            </div>
            <div style="display: flex; gap: 8px; margin-top: 15px;">
                <button class="action-btn" style="flex:1;" onclick="applyManualLocation()">Salva</button>
                <button class="action-btn" style="flex:1; background: #334155; color: #f8fafc;" onclick="useGPSLocation()">Usa GPS</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
