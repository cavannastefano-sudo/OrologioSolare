<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunclock 24H</title>
    <!-- Libreria SunCalc -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        body {
            background-color: #dbeafe;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            margin-bottom: 10px;
            color: #1e3a8a;
            font-size: 1.2rem;
        }

        #clock-wrapper {
            position: relative;
            width: 400px;
            height: 400px;
        }

        #clock-face {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: white;
            border: 1px solid #bbb;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Numeri delle ore 1-24 */
        .hour-num {
            position: absolute;
            font-size: 13px;
            font-weight: 600;
            color: #222;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 24px;
            z-index: 10;
            margin-left: -12px;
            margin-top: -12px;
        }

        /* La Luna */
        #moon-icon {
            position: absolute;
            font-size: 20px;
            z-index: 8;
            margin-left: -10px;
            margin-top: -10px;
            display: none;
        }

        /* Lancette */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
            z-index: 20;
        }

        #hand-hour { width: 5px; height: 36%; background: #ff7f00; } /* Lancetta ore arancione */
        #hand-second { width: 2px; height: 46%; background: red; z-index: 21; } /* Lancetta secondi rossa */
        #hand-utc { width: 3px; height: 40%; background: #00aa00; } /* Lancetta verde */

        #center-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin-left: -6px;
            margin-top: -6px;
            z-index: 25;
        }

        #info-panel {
            margin-top: 20px;
            background: rgba(255,255,255,0.9);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: #1e3a8a;
            text-align: center;
            border: 1px solid #bfdbfe;
        }
    </style>
</head>
<body>

    <h1>Orologio Solare 24H</h1>

    <div id="clock-wrapper">
        <div id="clock-face">
            <!-- Canvas per i colori del sole e la corona dei minuti -->
            <canvas id="clockCanvas" width="400" height="400"></canvas>
            
            <!-- Contenitore per i numeri delle ore -->
            <div id="hour-numbers-container"></div>

            <!-- La Luna -->
            <div id="moon-icon">🌑</div>

            <!-- Lancette -->
            <div class="hand" id="hand-hour"></div>
            <div class="hand" id="hand-second"></div>
            <div class="hand" id="hand-utc"></div>
            
            <!-- Centro -->
            <div id="center-dot"></div>
        </div>
    </div>

    <div id="info-panel">Rilevamento posizione in corso...</div>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 200;
        const cy = 200;
        const radius = 195;

        // Colori ufficiali stile Sunclock
        const COLORS = {
            night: '#101e2a',      // Notte profonda
            astro: '#23466b',      // Astronomico
            naut: '#4675a8',       // Nautico
            civil: '#7ba4d4',      // Civile
            day: '#e3f2fd'         // Giorno
        };

        function initClock() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        updateSunClock(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        // Fallback su coordinate standard se neghi il GPS (es. Roma)
                        updateSunClock(41.9028, 12.4964);
                        document.getElementById('info-panel').innerText = "Geolocalizzazione non attiva. Uso coordinate predefinite.";
                    }
                );
            } else {
                updateSunClock(41.9028, 12.4964);
            }
        }

        function updateSunClock(lat, lon) {
            const now = new Date();
            const times = SunCalc.getTimes(now, lat, lon);
            const moonPos = SunCalc.getMoonPosition(now, lat, lon);

            // Pulisci canvas
            ctx.clearRect(0, 0, 400, 400);

            // 1. DISEGNA LE FASCE DEL SOLE (Spioventi a spicchi 24h)
            drawSunSlices(times);

            // 2. DISEGNA CORONA ESTERNA MINUTI
            drawMinuteRing();

            // 3. POSIZIONA I NUMERI DELLE ORE (1-24)
            createHourNumbers(times);

            // 4. POSIZIONA LA LUNA
            updateMoon(moonPos);

            document.getElementById('info-panel').innerHTML = `Lat: ${lat.toFixed(2)}, Lon: ${lon.toFixed(2)}`;
        }

        function timeToHours(date) {
            if (!date || isNaN(date)) return 0;
            return date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
        }

        function hoursToAngle(h) {
            // 24 ore = 360 gradi. 0 ore (Mezzanotte) è in alto (-90 gradi in radianti)
            return (h / 24) * Math.PI * 2 - Math.PI / 2;
        }

        function drawSunSlices(times) {
            // Estrai gli orari chiave in formato decimale (0-24)
            const hSunrise = timeToHours(times.sunrise);
            const hSunset = timeToHours(times.sunset);
            const hDawn = timeToHours(times.dawn);
            const hDusk = timeToHours(times.dusk);
            const hNautDawn = timeToHours(times.nauticalDawn);
            const hNautDusk = timeToHours(times.nauticalDusk);
            const hAstroDawn = timeToHours(times.astronomicalDawn);
            const hAstroDusk = timeToHours(times.astronomicalDusk);

            // Semplificazione dei blocchi principali per il disegno circolare pulito
            drawSector(hAstroDawn, hDawn, COLORS.astro);
            drawSector(hDawn, hSunrise, COLORS.civil);
            drawSector(hSunrise, hSunset, COLORS.day);
            drawSector(hSunset, hDusk, COLORS.civil);
            drawSector(hDusk, hNautDusk, COLORS.naut);
            drawSector(hNautDusk, hAstroDusk, COLORS.astro);
            
            // Tutto il resto è notte
            // (Per semplicità visiva riempiamo prima tutto di notte e poi sovrapponiamo il giorno/crepuscoli)
        }

        function drawSector(startH, endH, color) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius - 20, hoursToAngle(startH), hoursToAngle(endH));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawMinuteRing() {
            for (let i = 0; i < 60; i++) {
                const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
                const isMajor = i % 5 === 0;
                const len = isMajor ? 10 : 5;

                const x1 = cx + (radius - len) * Math.cos(angle);
                const y1 = cy + (radius - len) * Math.sin(angle);
                const x2 = cx + radius * Math.cos(angle);
                const y2 = cy + radius * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#444';
                ctx.lineWidth = isMajor ? 1.5 : 1;
                ctx.stroke();

                // Numeri dei minuti ogni 5
                if (isMajor) {
                    const tx = cx + (radius - 22) * Math.cos(angle);
                    const ty = cy + (radius - 22) * Math.sin(angle);
                    ctx.fillStyle = '#444';
                    ctx.font = '8px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(String(i).padStart(2, '0'), tx, ty);
                }
            }
        }

        function createHourNumbers(times) {
            const container = document.getElementById('hour-numbers-container');
            container.innerHTML = '';
            const hRadius = radius * 0.75;

            const hSunrise = timeToHours(times.sunrise);
            const hSunset = timeToHours(times.sunset);

            for (let i = 1; i <= 24; i++) {
                const checkHour = i === 24 ? 0 : i;
                const angleRad = hoursToAngle(checkHour);
                
                const hx = cx + hRadius * Math.cos(angleRad);
                const hy = cy + hRadius * Math.sin(angleRad);

                const div = document.createElement('div');
                div.className = 'hour-num';
                div.style.left = `${hx}px`;
                div.style.top = `${hy}px`;
                div.innerText = i;

                // Colora i numeri di bianco se sono nelle ore notturne
                if (checkHour < hSunrise || checkHour > hSunset) {
                    div.style.color = '#ffffff';
                }

                container.appendChild(div);
            }
        }

        function updateMoon(moonPos) {
            const moonIcon = document.getElementById('moon-icon');
            // Posizionamento approssimativo basato sull'azimuth
            const moonClockAngle = (moonPos.azimuth + Math.PI) / (2 * Math.PI) * 360;
            const dist = radius * 0.55;
            const mx = cx + dist * Math.cos(moonClockAngle * Math.PI / 180 - Math.PI / 2);
            const my = cy + dist * Math.sin(moonClockAngle * Math.PI / 180 - Math.PI / 2);

            moonIcon.style.left = `${mx}px`;
            moonIcon.style.top = `${my}px`;
            moonIcon.style.display = 'block';
        }

        // AGGIORNAMENTO FLUIDO DELLE LANCETTE OGNI SECONDO
        function updateHands() {
            const now = new Date();
            const h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
            const m = now.getMinutes() + now.getSeconds() / 60;
            const s = now.getSeconds() + now.getMilliseconds() / 1000;

            // Rotazione lancetta 24h (Arancione)
            const hourDeg = (h / 24) * 360;
            document.getElementById('hand-hour').style.transform = `rotate(${hourDeg}deg)`;

            // Rotazione lancetta Secondi (Rossa)
            const secDeg = (s / 60) * 360;
            document.getElementById('hand-second').style.transform = `rotate(${secDeg}deg)`;

            // Lancetta UTC (Verde - basata sul tempo universale coordinato)
            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            const utcDeg = (utcHours / 24) * 360;
            document.getElementById('hand-utc').style.transform = `rotate(${utcDeg}deg)`;
        }

        // Avvio
        initClock();
        setInterval(updateHands, 50);
    </script>
</body>
</html>
