<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunclock 24H Corretto</title>
    <!-- Libreria SunCalc -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #f8fafc;
        }

        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
            font-size: 1.4rem;
        }

        #clock-wrapper {
            position: relative;
            width: 500px;
            height: 500px;
        }

        #clock-face {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
            border: 4px solid #334155;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Numeri delle ore 1-24 */
        .hour-num {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            z-index: 10;
            margin-left: -15px;
            margin-top: -15px;
        }

        /* La Luna */
        #moon-icon {
            position: absolute;
            font-size: 22px;
            z-index: 8;
            margin-left: -11px;
            margin-top: -11px;
            display: none;
        }

        /* Lancette */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            z-index: 20;
            transform: rotate(0deg);
        }

        #hand-hour { width: 6px; height: 38%; background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,0.6); } 
        #hand-second { width: 2px; height: 46%; background: #ef4444; z-index: 21; } 
        #hand-utc { width: 4px; height: 42%; background: #22c55e; } 

        #center-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ef4444;
            border: 2px solid #fff;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            margin-left: -9px;
            margin-top: -9px;
            z-index: 25;
        }

        #info-panel {
            margin-top: 20px;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-align: center;
            border: 1px solid #475569;
            width: 460px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
            font-size: 0.8rem;
        }

        .info-grid span {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <h1>Orologio Solare 24H</h1>

    <div id="clock-wrapper">
        <div id="clock-face">
            <canvas id="clockCanvas" width="500" height="500"></canvas>
            <div id="hour-numbers-container"></div>
            <div id="moon-icon">🌕</div>
            <div class="hand" id="hand-hour"></div>
            <div class="hand" id="hand-second"></div>
            <div class="hand" id="hand-utc"></div>
            <div id="center-dot"></div>
        </div>
    </div>

    <div id="info-panel">
        <div id="location-text">Rilevamento posizione in corso...</div>
        <div class="info-grid">
            <div>Alba: <span id="txt-sunrise">--:--</span></div>
            <div>Tramonto: <span id="txt-sunset">--:--</span></div>
            <div>Mezzogiorno: <span id="txt-noon">--:--</span></div>
            <div>Mezzanotte S.: <span id="txt-midnight">--:--</span></div>
            <div>Ora d'Oro M.: <span id="txt-mgold">--:--</span></div>
            <div>Ora d'Oro S.: <span id="txt-egold">--:--</span></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 250;
        const cy = 250;
        const radius = 245;

        const PALETTE = {
            night: '#050811',         
            astro: '#172554',         
            naut: '#1e3a8a',          
            civil: '#3b82f6',         
            golden: '#eab308',        
            sunriseSunset: '#f97316', 
            day: '#bae6fd'            
        };

        function initClock() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        updateSunClock(position.coords.latitude, position.coords.longitude);
                    },
                    (error) => {
                        updateSunClock(41.9028, 12.4964); 
                        document.getElementById('location-text').innerText = "GPS disattivato. Coordinate predefinite (Roma).";
                    }
                );
            } else {
                updateSunClock(41.9028, 12.4964);
            }
        }

        function updateSunClock(lat, lon) {
            const now = new Date();
            const times = SunCalc.getTimes(now, lat, lon);
            const moonPos = SunCalc.getMoonPosition(now, lat, lon);

            ctx.clearRect(0, 0, 500, 500);

            drawSunSlices(times);
            drawMinuteRing();
            createHourNumbers(times);
            updateMoon(moonPos);

            document.getElementById('location-text').innerHTML = `Lat: ${lat.toFixed(2)}, Lon: ${lon.toFixed(2)}`;
            document.getElementById('txt-sunrise').innerText = formatTime(times.sunrise);
            document.getElementById('txt-sunset').innerText = formatTime(times.sunset);
            document.getElementById('txt-noon').innerText = formatTime(times.solarNoon);
            document.getElementById('txt-midnight').innerText = formatTime(times.nightEnd);
            document.getElementById('txt-mgold').innerText = formatTime(times.goldenHourEnd);
            document.getElementById('txt-egold').innerText = formatTime(times.goldenHour);
        }

        function timeToHours(date) {
            if (!date || isNaN(date)) return 0;
            return date.getHours() + date.getMinutes() / 60 + date.getSeconds() / 3600;
        }

        // Con 24 in basso e 12 in alto: 
        // 12 ore = 0 gradi (verso l'alto), 24 ore = 180 gradi (verso il basso)
        function hoursToAngle(h) {
            return ((h - 12) / 24) * Math.PI * 2;
        }

        function drawSunSlices(times) {
            const hAstroDawn = timeToHours(times.astronomicalDawn);
            const hNautDawn = timeToHours(times.nauticalDawn);
            const hDawn = timeToHours(times.dawn);
            const hSunrise = timeToHours(times.sunrise);
            const hGoldenEnd = timeToHours(times.goldenHourEnd);
            
            const hGoldenStart = timeToHours(times.goldenHour);
            const hSunset = timeToHours(times.sunset);
            const hDusk = timeToHours(times.dusk);
            const hNautDusk = timeToHours(times.nauticalDusk);
            const hAstroDusk = timeToHours(times.astronomicalDusk);

            ctx.fillStyle = PALETTE.night;
            ctx.fillRect(0, 0, 500, 500);

            const rSlices = radius - 25;

            drawSector(hAstroDawn, hNautDawn, PALETTE.astro, rSlices);
            drawSector(hNautDawn, hDawn, PALETTE.naut, rSlices);
            drawSector(hDawn, hSunrise, PALETTE.civil, rSlices);
            drawSector(hSunrise - 0.1, hSunrise + 0.1, PALETTE.sunriseSunset, rSlices);
            drawSector(hSunrise, hGoldenEnd, PALETTE.golden, rSlices);
            drawSector(hGoldenEnd, hGoldenStart, PALETTE.day, rSlices);
            drawSector(hGoldenStart, hSunset, PALETTE.golden, rSlices);
            drawSector(hSunset - 0.1, hSunset + 0.1, PALETTE.sunriseSunset, rSlices);
            drawSector(hSunset, hDusk, PALETTE.civil, rSlices);
            drawSector(hDusk, hNautDusk, PALETTE.naut, rSlices);
            drawSector(hNautDusk, hAstroDusk, PALETTE.astro, rSlices);
        }

        function drawSector(startH, endH, color, r) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, hoursToAngle(startH), hoursToAngle(endH));
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        function drawMinuteRing() {
            for (let i = 0; i < 60; i++) {
                const angle = ((i - 15) / 60) * Math.PI * 2;
                const isMajor = i % 5 === 0;
                const len = isMajor ? 12 : 6;

                const x1 = cx + (radius - len) * Math.cos(angle);
                const y1 = cy + (radius - len) * Math.sin(angle);
                const x2 = cx + radius * Math.cos(angle);
                const y2 = cy + radius * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = isMajor ? 2 : 1;
                ctx.stroke();

                if (isMajor) {
                    const tx = cx + (radius - 22) * Math.cos(angle);
                    const ty = cy + (radius - 22) * Math.sin(angle);
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(String(i).padStart(2, '0'), tx, ty);
                }
            }
        }

        function createHourNumbers(times) {
            const container = document.getElementById('hour-numbers-container');
            container.innerHTML = '';
            const hRadius = radius * 0.72;

            const hSunrise = timeToHours(times.sunrise);
            const hSunset = timeToHours(times.sunset);

            for (let i = 1; i <= 24; i++) {
                const angleRad = hoursToAngle(i);
                
                const hx = cx + hRadius * Math.cos(angleRad);
                const hy = cy + hRadius * Math.sin(angleRad);

                const div = document.createElement('div');
                div.className = 'hour-num';
                div.style.left = `${hx}px`;
                div.style.top = `${hy}px`;
                div.innerText = i;

                if (i < hSunrise || i > hSunset) {
                    div.style.color = '#ffffff';
                } else {
                    div.style.color = '#0f172a';
                }

                container.appendChild(div);
            }
        }

        function updateMoon(moonPos) {
            const moonIcon = document.getElementById('moon-icon');
            const moonClockAngle = (moonPos.azimuth + Math.PI) / (2 * Math.PI) * 24;
            const angleRad = hoursToAngle(moonClockAngle);
            const dist = radius * 0.52;
            const mx = cx + dist * Math.cos(angleRad);
            const my = cy + dist * Math.sin(angleRad);

            moonIcon.style.left = `${mx}px`;
            moonIcon.style.top = `${my}px`;
            moonIcon.style.display = 'block';
        }

        function formatTime(date) {
            if (!date || isNaN(date)) return "--:--";
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function updateHands() {
            const now = new Date();
            const h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
            const s = now.getSeconds() + now.getMilliseconds() / 1000;

            // Conversione corretta in gradi (360 gradi / 24 ore = 15 gradi per ora)
            const hourDeg = (h / 24) * 360;
            document.getElementById('hand-hour').style.transform = `rotate(${hourDeg}deg)`;

            const secDeg = (s / 60) * 360;
            document.getElementById('hand-second').style.transform = `rotate(${secDeg}deg)`;

            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            const utcDeg = (utcHours / 24) * 360;
            document.getElementById('hand-utc').style.transform = `rotate(${utcDeg}deg)`;
        }

        initClock();
        setInterval(updateHands, 50);
    </script>
</body>
</html>
