<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunclock 24H App</title>
    <meta name="theme-color" content="#000000">
    
    <!-- Librerie ufficiali -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    
    <style>
        :root { --bg-color: #000000; }
        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; margin: 0; color: #f8fafc; transition: background-color 1s ease;
            -webkit-user-select: none; user-select: none;
        }
        header { display: flex; justify-content: space-between; align-items: center; width: min(90vw, 480px); margin-bottom: 5px; }
        h1 { margin: 0; color: #38bdf8; font-size: 1.3rem; }
        #btn-settings { background: #1e293b; color: #38bdf8; border: 1px solid #475569; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
        
        #clock-wrapper { position: relative; width: min(90vw, 480px); height: min(90vw, 480px); }
        #clock-face {
            width: 100%; height: 100%; border-radius: 50%; background: #000;
            border: 4px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative; overflow: hidden;
        }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .hour-num {
            position: absolute; font-weight: bold; text-align: center; font-size: 13px;
            color: #cbd5e1; width: 30px; height: 30px; line-height: 30px;
            margin-left: -15px; margin-top: -15px; pointer-events: none; z-index: 10;
        }

        .hand {
            position: absolute; bottom: 50%; left: 50%;
            transform-origin: bottom center; border-top-left-radius: 4px; border-top-right-radius: 4px; z-index: 20;
        }
        #hand-hour { width: 6px; height: 38%; background: #fbbf24; box-shadow: 0 0 8px rgba(251,191,36,0.6); } 
        #hand-minute { width: 4px; height: 42%; background: #38bdf8; z-index: 22; } 
        #hand-second { width: 2px; height: 46%; background: #ef4444; z-index: 23; } 
        #hand-utc { width: 4px; height: 40%; background: #22c55e; } 

        #center-dot {
            position: absolute; width: 14px; height: 14px; background: #ef4444;
            border: 2px solid #fff; border-radius: 50%; top: 50%; left: 50%;
            margin-left: -9px; margin-top: -9px; z-index: 25;
        }
        #info-panel {
            margin-top: 15px; background: #1e293b; padding: 10px 15px; border-radius: 10px;
            font-size: 0.85rem; color: #cbd5e1; text-align: center; border: 1px solid #475569; width: min(90vw, 460px);
        }
        .info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; font-size: 0.78rem; }
        .info-grid span { color: #38bdf8; font-weight: 600; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 90%; max-width: 380px; border: 1px solid #475569; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 12px; }
        .close-btn { background: none; border: none; color: #f8fafc; font-size: 1.2rem; cursor: pointer; }
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 6px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        .action-btn { background: #38bdf8; color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>Sunclock 24H</h1>
        <button id="btn-settings" onclick="toggleSettingsModal(true)">⚙️ Posizione</button>
    </header>

    <div id="clock-wrapper">
        <div id="clock-face">
            <canvas id="clockCanvas" width="500" height="500"></canvas>
            <div id="clock-elements-container"></div>
            <div class="hand" id="hand-hour"></div>
            <div class="hand" id="hand-minute"></div>
            <div class="hand" id="hand-second"></div>
            <div class="hand" id="hand-utc"></div>
            <div id="center-dot"></div>
        </div>
    </div>

    <div id="info-panel">
        <div id="location-text">Piacenza (Lat: 45.04, Lon: 9.68)</div>
        <div class="info-grid">
            <div>Alba: <span id="txt-sunrise">--:--</span></div>
            <div>Tramonto: <span id="txt-sunset">--:--</span></div>
            <div>Mezzogiorno: <span id="txt-noon">--:--</span></div>
        </div>
    </div>

    <!-- Modale Impostazioni -->
    <div id="modal-settings" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <strong>Imposta Posizione</strong>
                <button class="close-btn" onclick="toggleSettingsModal(false)">✕</button>
            </div>
            <div class="form-group">
                <label>Latitudine:</label>
                <input type="number" step="any" id="input-lat" value="45.04">
            </div>
            <div class="form-group">
                <label>Longitudine:</label>
                <input type="number" step="any" id="input-lon" value="9.68">
            </div>
            <button class="action-btn" onclick="applyManualLocation()" style="width:100%; margin-top:10px;">Salva</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas ? canvas.getContext('2d') : null;
        const cx = 250;
        const cy = 250;
        const radius = 248;

        const PALETTE = {
            night: '#000000',         
            astro: '#172554',         
            naut: '#1e3a8a',          
            civil: '#3b82f6',         
            sunriseSunset: '#f97316', 
            golden: '#eab308',        
            day: '#bae6fd'            
        };

        let cachedLat = 45.04;
        let cachedLon = 9.68;

        function init() {
            const savedLat = localStorage.getItem('sunclock_lat');
            const savedLon = localStorage.getItem('sunclock_lon');
            if (savedLat && savedLon) {
                cachedLat = parseFloat(savedLat);
                cachedLon = parseFloat(savedLon);
                document.getElementById('input-lat').value = cachedLat;
                document.getElementById('input-lon').value = cachedLon;
            }
            renderClock();
            createNumbers();
        }

        function getSunColor(alt) {
            if (alt >= 6) return PALETTE.day;
            if (alt >= 0) return PALETTE.golden;
            if (alt >= -0.833) return PALETTE.sunriseSunset;
            if (alt >= -6) return PALETTE.civil;
            if (alt >= -12) return PALETTE.naut;
            if (alt >= -18) return PALETTE.astro;
            return PALETTE.night;
        }

        function renderClock() {
            if (!ctx || typeof Astronomy === 'undefined') return;
            ctx.clearRect(0, 0, 500, 500);

            const observer = new Astronomy.Observer(cachedLat, cachedLon, 0);
            const baseDate = new Date();
            baseDate.setHours(0, 0, 0, 0);

            for (let i = 0; i < 1440; i += 2) {
                const fraction = i / 1440;
                const checkDate = new Date(baseDate.getTime() + fraction * 86400000);
                const astroTime = Astronomy.MakeTime(checkDate);
                const eq = Astronomy.Equator(Astronomy.Body.Sun, astroTime, observer, true, true);
                const hor = Astronomy.Horizon(astroTime, observer, eq.right_ascension, eq.declination, "normal");

                const color = getSunColor(hor.altitude);
                const angleDeg = fraction * 360;
                const startAngle = (angleDeg * Math.PI) / 180 - Math.PI / 2;
                const endAngle = ((angleDeg + 1.2) * Math.PI) / 180 - Math.PI / 2;

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            }

            for (let m = 0; m < 60; m++) {
                const angle = ((m / 60) * Math.PI * 2) - Math.PI / 2;
                const len = (m % 5 === 0) ? 14 : 7;
                const x1 = cx + (radius - len) * Math.cos(angle);
                const y1 = cy + (radius - len) * Math.sin(angle);
                const x2 = cx + radius * Math.cos(angle);
                const y2 = cy + radius * Math.sin(angle);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = (m % 5 === 0) ? 2 : 1;
                ctx.stroke();
            }

            if (typeof SunCalc !== 'undefined') {
                const times = SunCalc.getTimes(new Date(), cachedLat, cachedLon);
                if(times.sunrise && !isNaN(times.sunrise)) document.getElementById('txt-sunrise').innerText = times.sunrise.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if(times.sunset && !isNaN(times.sunset)) document.getElementById('txt-sunset').innerText = times.sunset.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                if(times.solarNoon && !isNaN(times.solarNoon)) document.getElementById('txt-noon').innerText = times.solarNoon.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            }
        }

        function createNumbers() {
            const container = document.getElementById('clock-elements-container');
            if (!container) return;
            container.innerHTML = '';
            const hRadius = radius * 0.65;
            for (let i = 1; i <= 24; i++) {
                const angleRad = ((i - 12) / 24) * Math.PI * 2 - Math.PI / 2;
                const hx = cx + hRadius * Math.cos(angleRad);
                const hy = cy + hRadius * Math.sin(angleRad);

                const div = document.createElement('div');
                div.className = 'hour-num';
                div.style.left = `${hx}px`;
                div.style.top = `${hy}px`;
                div.innerText = i;
                container.appendChild(div);
            }
        }

        function updateHands() {
            const now = new Date();
            const h = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
            const m = now.getMinutes() + now.getSeconds() / 60;
            const s = now.getSeconds() + now.getMilliseconds() / 1000;

            const hourDeg = ((h - 12) / 24) * 360;
            const minuteDeg = (m / 60) * 360;
            const secDeg = (s / 60) * 360;
            const utcHours = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
            const utcDeg = ((utcHours - 12) / 24) * 360;

            const hEl = document.getElementById('hand-hour');
            const mEl = document.getElementById('hand-minute');
            const sEl = document.getElementById('hand-second');
            const uEl = document.getElementById('hand-utc');

            if (hEl) hEl.style.transform = `rotate(${hourDeg}deg)`;
            if (mEl) mEl.style.transform = `rotate(${minuteDeg}deg)`;
            if (sEl) sEl.style.transform = `rotate(${secDeg}deg)`;
            if (uEl) uEl.style.transform = `rotate(${utcDeg}deg)`;
        }

        function toggleSettingsModal(show) {
            document.getElementById('modal-settings').style.display = show ? 'flex' : 'none';
        }

        function applyManualLocation() {
            const lat = parseFloat(document.getElementById('input-lat').value);
            const lon = parseFloat(document.getElementById('input-lon').value);
            if (!isNaN(lat) && !isNaN(lon)) {
                cachedLat = lat;
                cachedLon = lon;
                localStorage.setItem('sunclock_lat', lat);
                localStorage.setItem('sunclock_lon', lon);
                renderClock();
                toggleSettingsModal(false);
            }
        }

        init();
        setInterval(updateHands, 50);
    </script>
</body>
</html>
